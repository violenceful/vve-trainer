   {
    "id": "v21",
    "q": [21],
    "title": "Вопрос 21. Особенности строения прокариотической клетки",
    "html": "<p>Прокариоты — организмы, клетки которых не имеют оформленного ядра, отделённого от цитоплазмы ядерной оболочкой.</p>" +
     "<div class='sub'>Основные структуры бактериальной клетки</div>" +
     "<ol>" +
     "<li><b>Клеточная стенка.</b> У большинства бактерий содержит муреин (пептидогликан). Обеспечивает поддержание формы клетки, механическую прочность и защиту от осмотического разрушения. Клеточная стенка не является основной избирательно проницаемой границей клетки.</li>" +
     "<li><b>Цитоплазматическая мембрана.</b> Отделяет цитоплазму от внешней среды. Выполняет функции избирательного транспорта веществ, поддержания ионных градиентов, участия в энергетическом обмене и размещения ряда ферментных систем.</li>" +
     "<li><b>Нуклеоид.</b> Область цитоплазмы, в которой располагается основная хромосома бактерии. У многих бактерий она представлена одной кольцевой двухцепочечной молекулой ДНК. В отличие от эукариот, нуклеоид не окружён ядерной оболочкой.</li>" +
     "<li><b>Плазмиды.</b> Небольшие внехромосомные молекулы ДНК, способные к самостоятельной репликации. Могут содержать дополнительные гены, например обеспечивающие устойчивость к антибиотикам или определённые метаболические свойства.</li>" +
     "<li><b>Рибосомы.</b> В бактериальных клетках присутствуют рибосомы 70S, состоящие из малой и большой субъединиц. Обеспечивают синтез белка.</li>" +
     "<li><b>Цитоскелетоподобные белки.</b> У бактерий присутствуют белки, участвующие в поддержании формы клетки, делении и организации внутриклеточных структур. Нельзя утверждать, что у прокариот полностью отсутствует цитоскелет.</li>" +
     "<li><b>Жгутики.</b> Некоторые бактерии обладают жгутиками, состоящими преимущественно из белка флагеллина. Обеспечивают движение клетки. Бактериальные жгутики по устройству и механизму движения отличаются от жгутиков и ресничек эукариот.</li>" +
     "<li><b>Пили и фимбрии.</b> Поверхностные белковые структуры, выполняющие различные функции: прикрепление к поверхностям, взаимодействие с другими клетками, участие в передаче генетического материала при конъюгации (у соответствующих бактерий).</li>" +
     "<li><b>Капсула и слизистый слой.</b> Дополнительные наружные структуры, которые могут обеспечивать защиту от неблагоприятных факторов, прикрепление, образование биоплёнок и взаимодействие с окружающей средой.</li>" +
     "</ol>" +
     "<div class='sub'>Дополнительные особенности</div>" +
     "<p>У бактерий отсутствуют типичные мембранные органоиды эукариот, такие как оформленное ядро, митохондрии и аппарат Гольджи. При этом у некоторых бактерий существуют специализированные внутриклеточные мембранные структуры.</p>" +
     "<p>Мезосомы не следует включать в нормальный состав бактериальной клетки: структуры, ранее описывавшиеся как мезосомы, были признаны артефактами химической фиксации клеток.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Бактериальная клетка имеет относительно простую организацию по сравнению с эукариотической, однако обладает всеми необходимыми структурами для обмена веществ, хранения наследственной информации, синтеза белков, роста и размножения.</p>"
   },
   {
    "id": "v22",
    "q": [22],
    "title": "Вопрос 22. Основные метаболические группы бактерий",
    "html": "<p>Метаболические группы бактерий классифицируют по трём независимым признакам: источник энергии, источник электронов, источник углерода. Именно сочетание этих признаков позволяет характеризовать тип питания организма.</p>" +
     "<div class='sub'>1. По источнику энергии</div>" +
     "<ul>" +
     "<li><b>Фототрофы</b> — используют свет в качестве источника энергии.</li>" +
     "<li><b>Хемотрофы</b> — получают энергию за счёт химических превращений веществ, обычно связанных с окислительно-восстановительными реакциями.</li>" +
     "</ul>" +
     "<div class='sub'>2. По источнику электронов</div>" +
     "<ul>" +
     "<li><b>Литотрофы</b> — используют неорганические вещества в качестве доноров электронов (например, H₂, H₂S, Fe²⁺).</li>" +
     "<li><b>Органотрофы</b> — используют органические вещества в качестве доноров электронов.</li>" +
     "</ul>" +
     "<div class='sub'>3. По источнику углерода</div>" +
     "<ul>" +
     "<li><b>Автотрофы</b> — используют неорганический углерод, преимущественно CO₂, для синтеза органических веществ.</li>" +
     "<li><b>Гетеротрофы</b> — используют готовые органические вещества в качестве источника углерода.</li>" +
     "</ul>" +
     "<div class='sub'>Основные сочетания метаболических признаков</div>" +
     "<p><b>Фотоавтотрофы</b> используют свет как источник энергии и CO₂ как источник углерода.</p>" +
     "<p><b>Фотолитоавтотрофы</b> используют неорганические доноры электронов. Примеры: цианобактерии, использующие воду; зелёные серные бактерии, использующие сероводород; пурпурные серные бактерии, использующие неорганические доноры электронов.</p>" +
     "<p><b>Фотоорганоавтотрофы</b> используют свет как источник энергии, органические соединения как доноры электронов и CO₂ как источник углерода.</p>" +
     "<p><b>Фотогетеротрофы</b> используют свет как источник энергии, но нуждаются в органических соединениях в качестве источника углерода.</p>" +
     "<p><b>Фотолито-гетеротрофы</b> используют неорганические доноры электронов и органические вещества как источник углерода. <b>Фотооргано-гетеротрофы</b> используют органические соединения как источники электронов и углерода; к этой группе относятся некоторые несерные пурпурные бактерии.</p>" +
     "<p><b>Хемоавтотрофы</b> получают энергию за счёт химических реакций и используют CO₂ как источник углерода.</p>" +
     "<p><b>Хемолитоавтотрофы</b> используют неорганические доноры электронов. Примеры: нитрифицирующие бактерии; бактерии, окисляющие соединения серы.</p>" +
     "<p><b>Хемоорганоавтотрофы</b> используют органические вещества в качестве доноров электронов и CO₂ в качестве основного источника углерода. Эту категорию не следует иллюстрировать метаногенами: метаногены относятся к археям, а не к бактериям.</p>" +
     "<p><b>Хемогетеротрофы</b> получают энергию за счёт химических реакций и используют органические соединения как источник углерода.</p>" +
     "<p><b>Хемоорганогетеротрофы</b> используют органические вещества как источники и электронов, и углерода. К этой группе относится значительная часть известных бактерий, например молочнокислые бактерии.</p>" +
     "<p><b>Хемолитогетеротрофы</b> используют неорганические вещества в качестве доноров электронов и органические вещества как источник углерода. Такие сочетания встречаются у отдельных микроорганизмов.</p>" +
     "<div class='sub'>Главный принцип классификации</div>" +
     "<p>Нельзя смешивать фототрофию, литотрофию и автотрофию: они характеризуют разные стороны метаболизма. Например, фототрофный организм не обязательно является автотрофом, а хемотрофный организм не обязательно является гетеротрофом.</p>"
   },

    "q": [23],
    "title": "Вопрос 23. Основные гипотезы происхождения эукариотической клетки",
    "html": "<p>Эукариотические клетки отличаются от прокариотических наличием оформленного ядра и развитой системы внутриклеточных мембранных структур. Существуют несколько гипотез происхождения отдельных компонентов эукариотической клетки.</p>" +
     "<div class='sub'>1. Симбиогенетическая гипотеза (эндосимбиотическая теория)</div>" +
     "<p>Согласно этой гипотезе, некоторые органоиды эукариотической клетки произошли от свободноживущих прокариот, вступивших в устойчивые симбиотические отношения с клеткой-хозяином.</p>" +
     "<p>Основные события: предковая аэробная бактерия вошла в состав клетки-хозяина и в процессе эволюции превратилась в митохондрию; предковая цианобактерия стала эндосимбионтом и в дальнейшем дала начало пластидам, включая хлоропласты. Первичное происхождение пластид связано с эндосимбиозом цианобактерий в предках растений и других представителей группы Archaeplastida.</p>" +
     "<p>Доказательства эндосимбиотического происхождения:</p>" +
     "<ol>" +
     "<li>собственная ДНК — митохондрии и пластиды обладают собственным генетическим материалом, отличным от ядерного генома клетки;</li>" +
     "<li>бактериальное происхождение генов — последовательности генов митохондрий и пластид демонстрируют сходство с соответствующими генами бактериальных групп;</li>" +
     "<li>рибосомы — в митохондриях и пластидах присутствуют рибосомы, сходные по происхождению и ряду характеристик с бактериальными;</li>" +
     "<li>деление органоидов — митохондрии и пластиды способны увеличивать своё количество посредством деления существующих органоидов;</li>" +
     "<li>двойные мембраны — наличие двух мембран у этих органоидов согласуется с их эндосимбиотическим происхождением.</li>" +
     "</ol>" +
     "<div class='sub'>2. Гипотеза инвагинации (автогенная гипотеза происхождения эндомембранной системы)</div>" +
     "<p>Согласно этой гипотезе, часть внутриклеточных мембранных структур образовалась в результате впячивания плазматической мембраны древней прокариотоподобной клетки. С этим механизмом связывают происхождение ядерной оболочки, эндоплазматической сети, комплекса Гольджи и других элементов эндомембранной системы.</p>" +
     "<p>Эта гипотеза рассматривается отдельно от эндосимбиотической теории: обе модели могут объяснять происхождение разных компонентов эукариотической клетки. Она не предназначена для объяснения бактериального происхождения митохондрий и пластид.</p>" +
     "<div class='sub'>3. Вирусная гипотеза происхождения ядра</div>" +
     "<p>Согласно этой гипотезе, происхождение ядра эукариотической клетки может быть связано с древними крупными ДНК-содержащими вирусами. В качестве возможных аргументов обсуждаются сходство отдельных белков, участвующих в репликации и организации генетического материала; способность некоторых вирусов формировать специализированные внутриклеточные структуры; сложные взаимодействия вирусных генетических систем с клетками-хозяевами.</p>" +
     "<p>Ограничение: вирусная гипотеза остаётся спорной и не имеет достаточного количества прямых доказательств, чтобы заменить основные представления о происхождении эукариотической клетки.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Наиболее убедительные доказательства имеет эндосимбиотическое происхождение митохондрий и пластид. Происхождение ядра и других компонентов эукариотической клетки рассматривается отдельно и требует объяснения с привлечением дополнительных эволюционных механизмов.</p>"
   }
  ]

    "q": [24],
    "title": "Вопрос 24. Элементарные факторы эволюции. Конвариантная репликация",
    "html": "<p>Эволюция представляет собой процесс изменения наследственных характеристик популяций организмов в последовательных поколениях.</p>" +
     "<div class='sub'>1. Конвариантная репликация</div>" +
     "<p>Согласно программе курса, конвариантная редупликация — свойство самовоспроизведения нуклеиновых кислот, осуществляемого на основе матричного принципа. При репликации новая молекула нуклеиновой кислоты синтезируется на основе информации, содержащейся в матрице. При этом в процессе копирования могут возникать ошибки и изменения последовательности нуклеотидов. Если такие изменения сохраняются и передаются последующим поколениям, они создают наследственную изменчивость.</p>" +
     "<p>Значение конвариантной репликации:</p>" +
     "<ol><li>обеспечивает передачу наследственной информации;</li><li>позволяет сохранять наследственные признаки при размножении;</li><li>создаёт возможность накопления наследственных изменений;</li><li>обеспечивает материал для действия естественного отбора.</li></ol>" +
     "<p>Таким образом, конвариантная репликация является важной предпосылкой биологической эволюции.</p>" +
     "<p>Важно: она не тождественна исключительно неидеальному копированию ДНК. Речь идёт о матричном самовоспроизведении нуклеиновых кислот, потенциально сопровождающемся наследственными изменениями.</p>" +
     "<div class='sub'>2. Естественный отбор</div>" +
     "<p>Естественный отбор — процесс, в результате которого наследственные варианты, повышающие репродуктивный успех организмов в определённых условиях среды, становятся более распространёнными в популяции. Выделяют следующие формы:</p>" +
     "<ul>" +
     "<li><b>стабилизирующий отбор</b> — способствует сохранению средних значений признака и устранению крайних отклонений при относительно постоянных условиях среды;</li>" +
     "<li><b>движущий отбор</b> — способствует распространению одного из крайних вариантов признака при изменении условий среды;</li>" +
     "<li><b>разрывающий (дизруптивный) отбор</b> — способствует распространению нескольких крайних вариантов признака и может приводить к уменьшению распространённости промежуточных значений.</li>" +
     "</ul>" +
     "<div class='sub'>3. Наследственная изменчивость</div>" +
     "<p>Представляет собой источник различий между организмами, передаваемых следующим поколениям. Основные формы:</p>" +
     "<ul>" +
     "<li><b>мутационная изменчивость</b> — возникает вследствие изменений генетического материала;</li>" +
     "<li><b>комбинативная изменчивость</b> — связана с образованием новых комбинаций наследственного материала. У организмов, размножающихся половым путём, её источниками являются кроссинговер, независимое распределение хромосом и случайное сочетание гамет.</li>" +
     "</ul>" +
     "<div class='sub'>4. Дрейф генов</div>" +
     "<p>Дрейф генов — случайное изменение частот аллелей в популяции. Особенно заметно проявляется в небольших популяциях. В отличие от естественного отбора, дрейф генов не обязательно связан с адаптивными преимуществами определённых аллелей.</p>" +
     "<p><b>Эффект бутылочного горлышка</b> возникает при резком сокращении численности популяции. Генофонд новой популяции формируется из наследственного материала случайно выживших особей.</p>" +
     "<p><b>Эффект основателя</b> возникает при образовании новой популяции небольшой группой особей исходной популяции. В результате новая популяция может иметь иной набор частот аллелей.</p>" +
     "<div class='sub'>5. Миграции и поток генов</div>" +
     "<p>Миграции особей между популяциями могут приводить к переносу генов. Обмен генами способен изменять частоты аллелей и уменьшать генетические различия между популяциями.</p>" +
     "<div class='sub'>6. Популяционные волны</div>" +
     "<p>Популяционные волны — периодические или непериодические колебания численности популяций. Они могут влиять на генетический состав популяции и усиливать действие дрейфа генов, особенно при резких сокращениях численности.</p>" +
     "<div class='sub'>7. Изоляция</div>" +
     "<p>Изоляция ограничивает обмен генами между популяциями и способствует их генетическому обособлению. Основные формы:</p>" +
     "<ul><li><b>географическая</b> — обусловлена пространственными препятствиями между популяциями;</li><li><b>экологическая</b> — обусловлена различиями в условиях существования, экологических нишах и особенностях размножения.</li></ul>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Эволюционные изменения обусловлены взаимодействием наследственной изменчивости, естественного отбора, дрейфа генов, миграций и изоляции. Конвариантная репликация обеспечивает возможность передачи наследственной информации и накопления изменений, на основе которых происходят эволюционные процессы.</p>"
   },
   {

    "title": "Вопрос 25. Одноклеточный уровень организации эукариотических организмов",
    "html": "<p>Одноклеточные эукариоты — организмы, тело которых состоит из одной клетки, способной самостоятельно осуществлять основные жизненные функции. К ним относятся, например, амёбы, инфузории, эвглены, хламидомонады.</p>" +
     "<div class='sub'>Основные особенности</div>" +
     "<ol>" +
     "<li><b>Наличие оформленного ядра.</b> Наследственный материал находится в ядре, отделённом от цитоплазмы ядерной оболочкой.</li>" +
     "<li><b>Наличие мембранных органоидов.</b> В клетках многих одноклеточных эукариот присутствуют митохондрии, эндоплазматическая сеть, аппарат Гольджи, различные типы вакуолей.</li>" +
     "<li><b>Развитый цитоскелет.</b> Обеспечивает поддержание формы клетки, движение и внутриклеточный транспорт.</li>" +
     "<li><b>Специализированные структуры.</b> В зависимости от организма могут присутствовать псевдоподии, реснички, жгутики, сократительные вакуоли, пелликула. Эти структуры обеспечивают передвижение, питание, поддержание водно-солевого баланса и защиту.</li>" +
     "</ol>" +
     "<div class='sub'>Преимущества одноклеточной организации</div>" +
     "<ul>" +
     "<li>относительная простота организации;</li>" +
     "<li>возможность быстрого размножения при благоприятных условиях;</li>" +
     "<li>небольшие затраты ресурсов на поддержание организма;</li>" +
     "<li>возможность непосредственного взаимодействия клетки с окружающей средой.</li>" +
     "</ul>" +
     "<div class='sub'>Ограничения одноклеточности</div>" +
     "<ol>" +
     "<li><b>Ограничения размеров.</b> Увеличение размеров клетки сопровождается изменением соотношения площади поверхности и объёма. Это затрудняет эффективный обмен веществами с окружающей средой.</li>" +
     "<li><b>Ограниченность функциональной специализации.</b> Одна клетка должна совмещать множество функций, что ограничивает возможности специализации по сравнению с многоклеточными организмами.</li>" +
     "<li><b>Уязвимость.</b> Повреждение единственной клетки может привести к гибели всего организма.</li>" +
     "</ol>" +
     "<div class='sub'>Значение одноклеточных эукариот в эволюции</div>" +
     "<p>Одноклеточные эукариоты демонстрируют высокую степень структурной и функциональной сложности на уровне одной клетки. Многоклеточность неоднократно возникала в ходе эволюции различных групп эукариот.</p>" +
     "<p>Однако неверно считать современных одноклеточных эукариот прямой промежуточной ступенью между прокариотами и всеми многоклеточными организмами.</p>"

   {
    "id": "v26",
    "q": [26],
    "title": "Вопрос 26. Основные гипотезы происхождения многоклеточных организмов",
    "html": "<p>Основные исторические гипотезы происхождения многоклеточных животных связывают возникновение многоклеточности с объединением одноклеточных организмов в колониальные структуры и последующей специализацией клеток.</p>" +
     "<div class='sub'>1. Теория гастреи (Э. Геккель)</div>" +
     "<p>Согласно теории гастреи, предком многоклеточных животных была гипотетическая колониальная форма, клетки которой образовали два слоя. В результате впячивания стенки исходной колонии возникла двухслойная структура, напоминающая гаструлу. Такая гипотетическая форма получила название гастреи.</p>" +
     "<p>Основная идея теории заключается в том, что двухслойное строение тела могло возникнуть из однослойной колонии клеток.</p>" +
     "<p>Значение: теория гастреи стала одной из первых попыток объяснить происхождение многоклеточной организации через колониальные формы.</p>" +
     "<p>Ограничение: модель является исторической гипотезой и не рассматривается как окончательно доказанная схема происхождения всех многоклеточных животных.</p>" +
     "<div class='sub'>2. Теория фагоцителлы (И. И. Мечников)</div>" +
     "<p>Мечников предполагал, что предком многоклеточных животных могла быть колониальная структура, внутри которой возникли клетки, способные к захвату и внутриклеточному перевариванию пищевых частиц. Такую гипотетическую форму называют фагоцителлой.</p>" +
     "<p>В этой модели: клетки наружного слоя могли выполнять защитную и двигательную функции; внутренние клетки обеспечивали питание посредством фагоцитоза; постепенно формировалась специализация клеток и интеграция функций организма.</p>" +
     "<p>Значение: теория подчёркивает важность клеточной специализации и внутриклеточного пищеварения на ранних этапах формирования многоклеточной организации.</p>" +
     "<div class='sub'>3. Современные представления</div>" +
     "<p>Происхождение многоклеточности нельзя свести к одной универсальной модели. Многоклеточные формы независимо возникали у различных групп эукариот, включая животных, растения, грибы и некоторые группы водорослей. Для происхождения животных особый интерес представляют колониальные предки, родственные современным хоанофлагеллятам.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Теории гастреи и фагоцителлы представляют собой исторические модели происхождения многоклеточных животных. Обе подчёркивают значение колониальной организации, специализации клеток и формирования целостного организма.</p>" +
     "<p>Однако они не описывают полностью все пути происхождения многоклеточности у разных групп эукариот.</p>"
   },

     "<p>Целом — вторичная полость тела, расположенная между стенкой тела и внутренними органами и выстланная мезодермальным эпителием. Она присутствует у ряда групп животных, например кольчатых червей, моллюсков, иглокожих и хордовых.</p>" +

     "<div class='sub'>5. Освоение наземной среды</div>" +
     "<p>Выход живых организмов на сушу происходил неоднократно и независимо у различных групп. Для наземного существования потребовались адаптации, связанные с предотвращением обезвоживания, обеспечением газообмена, поддержанием опоры тела, перемещением в воздушной среде, размножением вне водной среды.</p>" +
     "<p>Освоение суши происходило постепенно: первыми наземные среды начали осваивать растения и членистоногие; позднее на сушу вышли позвоночные животные. Нельзя считать, что все эти группы одновременно появились на суше в течение одного короткого периода.</p>" +

function qMatch(it, q){ return q === null || (it && it.q && it.q.indexOf(q) !== -1); }

function buildChips(boxId, list, active, onPick){
  var box = $(boxId);
  var h = '<button class="chip" type="button" data-short="all" aria-pressed="' + (active === null) + '">Все</button>';
  list.forEach(function(sec){
    h += '<button class="chip" type="button" data-short="' + esc(sec.short) + '" aria-pressed="' + (active === sec.short) + '">' + esc(sec.short) + '</button>';
  });
  box.innerHTML = h;
  box.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      var v = b.getAttribute('data-short');
      onPick(v === 'all' ? null : (active === v ? null : v));
    });
  });
}

var QNUMS = Object.keys(QNAMES).map(function(k){ return parseInt(k, 10); }).sort(function(a, b){ return a - b; });
function buildQSelect(id, active, onPick){
  var sel = $(id);
  var h = '<option value="">Все вопросы экзамена</option>';
  QNUMS.forEach(function(n){
    h += '<option value="' + n + '"' + (active === n ? ' selected' : '') + '>Вопрос ' + n + ' · ' + esc(QNAMES[n]) + '</option>';
  });
  sel.innerHTML = h;
  sel.onchange = function(){ onPick(sel.value === '' ? null : parseInt(sel.value, 10)); };
}

var activeSec = null;
var activeQ = null;

function renderChips(){
  buildChips('chips', SECTIONS, activeSec, function(v){
    activeSec = v;
    renderChips();
    render();
  });
}

function render(){
  var secs = [];
  SECTIONS.forEach(function(sec){
    if(activeSec !== null && sec.short !== activeSec) return;
    var items = sec.items.filter(function(it){ return qMatch(it, activeQ); });
    if(items.length) secs.push({title: sec.title, items: items, total: sec.items.length});
  });
  var total = 0, shown = 0;
  SECTIONS.forEach(function(sec){ total += sec.items.length; });
  secs.forEach(function(sec){ shown += sec.items.length; });

  if(activeQ !== null){
    $('sum').textContent = 'Вопрос ' + activeQ + ' · ' + QNAMES[activeQ] + ': ' + shown + ' формулировок' + (activeSec !== null ? ' (раздел «' + activeSec + '»).' : '.');
  } else if(activeSec === null){
    $('sum').textContent = 'Всего: ' + total + ' формулировок в ' + SECTIONS.length + ' разделах.';
  } else {
    $('sum').textContent = 'Показан раздел «' + secs[0].title + '» — ' + shown + ' формулировок.';
  }

  var html = '';
  secs.forEach(function(sec){
    html += '<section class="sec">';
    html += '<h2 class="sec-h"><span>' + esc(sec.title) + '</span><span class="cnt">' + (activeQ === null ? 'всего: ' + sec.items.length : 'показано: ' + sec.items.length + ' из ' + sec.total) + '</span></h2>';
    sec.items.forEach(function(it){
      html += '<article class="card">';
      html += '<h3 class="card-t">' + esc(it.title) + '</h3>';
      html += '<div class="card-b">' + it.html + '</div>';
      html += '</article>';
    });
    html += '</section>';
  });
  if(!html) html = '<div class="summary">По этому фильтру формулировок нет.</div>';
  $('ref').innerHTML = html;
}

function updateThemeBtn(){
  var btn = $('theme');
  if(!btn) return;
  var t = document.documentElement.getAttribute('data-theme');
  var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  btn.textContent = dark ? '☀' : '🌙';
  btn.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
}

function initTheme(){
  try{
    var s = localStorage.getItem('theme');
    if(s === 'light' || s === 'dark') document.documentElement.setAttribute('data-theme', s);
  }catch(e){}
  updateThemeBtn();
}

function toggleTheme(){
  var t = document.documentElement.getAttribute('data-theme');
  var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  var next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  updateThemeBtn();
}

initTheme();
renderChips();
render();
buildQSelect('qsel', activeQ, function(v){ activeQ = v; render(); });

var RECALL_KEY = 'est-recall-v1';
var recallSec = null;
var recallQ = null;
var recallQueue = [];
var recallTotal = 0;
var recallLearned = 0;
var recallCurrent = null;
var recallAnswered = false;
var recallKnown = {};
var recallOrder = 'random';
var recallMissed = 0;

function recallLoad(){
  try{
    var raw = localStorage.getItem(RECALL_KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.known && typeof o.known === 'object') recallKnown = o.known;
    }
  }catch(e){}
}

function recallSave(){
  try{ localStorage.setItem(RECALL_KEY, JSON.stringify({known: recallKnown})); }catch(e){}
}

function recallShuffle(a){
  a = a.slice();
  for(var k = a.length - 1; k > 0; k--){
    var j = Math.floor(Math.random() * (k + 1));
    var t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}

function recallAllItems(){
  var arr = [];
  SECTIONS.forEach(function(sec){
    sec.items.forEach(function(it){
      arr.push({
        id: it.id,
        title: it.title,
        html: it.html,
        q: it.q || [],
        secShort: sec.short,
        secTitle: sec.title
      });
    });
  });
  return arr;
}

var RECALL_ALL = recallAllItems();

function recallFiltered(){
  return RECALL_ALL.filter(function(x){
    return (recallSec === null || x.secShort === recallSec) && qMatch(x, recallQ);
  });
}

function recallRenderChips(){
  buildChips('rchips', SECTIONS, recallSec, function(v){
    recallSec = v;
    recallReset();
  });
}

function recallReset(){
  recallRenderChips();
  var items = recallFiltered();
  var rest = items.filter(function(x){ return !recallKnown[x.id]; });
  recallTotal = items.length;
  recallLearned = recallTotal - rest.length;
  recallQueue = recallOrder === 'slides' ? rest.slice() : recallShuffle(rest);
  recallMissed = 0;
  buildQSelect('rqsel', recallQ, function(v){ recallQ = v; recallReset(); });
  $('rorder').textContent = recallOrder === 'slides' ? 'Порядок: по конспекту' : 'Порядок: случайно';
  recallCurrent = null;
  recallAnswered = false;
  recallNext();
}

function recallNext(){
  $('rresult').hidden = true;
  $('rinput').readOnly = false;
  recallAnswered = false;

  if(recallQueue.length === 0){
    $('rsum').textContent = recallTotal === 0
      ? 'По этому фильтру формулировок нет.'
      : 'Готово: выучено ' + recallLearned + ' из ' + recallTotal + '.' + (recallMissed > 0 ? ' Не знал за сессию: ' + recallMissed + '.' : '');
    $('rsec').textContent = '';
    $('rtitle').textContent = recallTotal === 0
      ? 'Выберите другой раздел или вопрос.'
      : 'Все формулировки этого набора выучены. Можно выбрать другой раздел или начать заново.';
    $('rinput').hidden = true;
    $('rcheck').hidden = true;
    $('rrestart').hidden = false;
    return;
  }

  $('rrestart').hidden = true;
  $('rinput').hidden = false;
  $('rcheck').hidden = false;
  $('rinput').value = '';
  recallCurrent = recallQueue.shift();
  $('rsec').textContent = recallCurrent.secTitle;
  $('rtitle').textContent = recallCurrent.title;
  $('rsum').textContent = 'Выучено: ' + recallLearned + ' из ' + recallTotal
    + ' · В очереди: ' + (recallQueue.length + 1)
    + (recallMissed > 0 ? ' · Не знал: ' + recallMissed : '') + '.';
}

$('rcheck').addEventListener('click', function(){
  if(!recallCurrent || recallAnswered) return;
  recallAnswered = true;
  $('rresult-body').innerHTML = recallCurrent.html;
  $('rresult').hidden = false;
  $('rcheck').hidden = true;
  $('rinput').readOnly = true;
});

$('ryes').addEventListener('click', function(){
  if(!recallCurrent) return;
  recallKnown[recallCurrent.id] = true;
  recallSave();
  recallLearned++;
  recallNext();
});

$('rno').addEventListener('click', function(){
  if(!recallCurrent) return;
  recallMissed++;
  errRecall(recallCurrent.id);
  var pos = Math.min(recallQueue.length, 3 + Math.floor(Math.random() * 4));
  recallQueue.splice(pos, 0, recallCurrent);
  recallNext();
});

$('rorder').addEventListener('click', function(){
  recallOrder = recallOrder === 'slides' ? 'random' : 'slides';
  recallReset();
});

$('rrestart').addEventListener('click', function(){
  recallFiltered().forEach(function(x){ delete recallKnown[x.id]; });
  recallSave();
  recallReset();
});

  for(var i = 0; i < SECTIONS.length; i++){
    for(var j = 0; j < SECTIONS[i].items.length; j++){

}

var ERR_KEY = 'est-errors-v1';
var ERR = { test: {}, recall: {} };

function errLoad(){
  try{
    var raw = localStorage.getItem(ERR_KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.test && typeof o.test === 'object') ERR.test = o.test;
      if(o && o.recall && typeof o.recall === 'object') ERR.recall = o.recall;
    }
  }catch(e){}
}

function errSave(){
  try{ localStorage.setItem(ERR_KEY, JSON.stringify(ERR)); }catch(e){}
}

function errCounts(){
  return { test: Object.keys(ERR.test).length, recall: Object.keys(ERR.recall).length };
}

function errTest(id, ok){
  if(!id || ok) return;
  var rec = ERR.test[id];
  if(!rec){ rec = ERR.test[id] = { wrong: 0 }; }
  rec.wrong = (rec.wrong || 0) + 1;
  errSave();
  updateErrorsBadge();
}

function errRecall(id){
  if(!id) return;
  var rec = ERR.recall[id];
  if(!rec){ rec = ERR.recall[id] = { missed: 0 }; }
  rec.missed = (rec.missed || 0) + 1;
  errSave();
  updateErrorsBadge();
}

function updateErrorsBadge(){
  var badge = $('errcnt');
  if(!badge) return;
  var c = errCounts();
  var total = c.test + c.recall;
  badge.textContent = total;
  badge.hidden = total === 0;
}

function testSourceLabel(t){
  var eq = 0;
  if(t && t.card) eq = parseInt(String(t.card).replace(/\D/g, ''), 10) || 0;
  return 'Источник: «Вставленный текст(3).txt», вопрос ' + (eq || '—') + ' (пагинация и слайды отсутствуют)';
}

var TEST_BY_ID = {};
TESTS.forEach(function(t){ TEST_BY_ID[t.id] = t; });

var RECALL_BY_ID = {};
RECALL_ALL.forEach(function(x){ RECALL_BY_ID[x.id] = x; });

var ERR_VIEW = {};

var errSec = null;
var errMode = 'list';

function errSecList(){
  var set = {};
  Object.keys(ERR.test).forEach(function(id){
    var t = TEST_BY_ID[id];
    if(t && CARD_SEC[t.card]) set[CARD_SEC[t.card]] = true;
  });
  Object.keys(ERR.recall).forEach(function(id){
    var it = RECALL_BY_ID[id];
    if(it && it.secShort) set[it.secShort] = true;
  });
  var out = [];
  SECTIONS.forEach(function(s){ if(set[s.short]) out.push({ short: s.short, title: s.title }); });
  return out;
}

function errTestMatches(id){
  var t = TEST_BY_ID[id];
  if(!t) return false;
  return errSec === null || CARD_SEC[t.card] === errSec;
}
function errRecallMatches(id){
  var it = RECALL_BY_ID[id];
  if(!it) return false;
  return errSec === null || it.secShort === errSec;
}

function errRenderChips(){
  buildChips('echips', errSecList(), errSec, function(v){
    errSec = v;
    errRender();
  });
}

function errCountsFiltered(){
  var t = 0, r = 0;
  Object.keys(ERR.test).forEach(function(id){ if(errTestMatches(id)) t++; });
  Object.keys(ERR.recall).forEach(function(id){ if(errRecallMatches(id)) r++; });
  return { test: t, recall: r };
}

function updateErrorSummary(){
  var c = errCounts();
  $('ereset').hidden = (c.test + c.recall) === 0;
}

function renderErrors(){
  ERR_VIEW = {};
  var tIds = Object.keys(ERR.test).filter(errTestMatches).sort(function(a, b){
    return ((ERR.test[b] && ERR.test[b].wrong) || 0) - ((ERR.test[a] && ERR.test[a].wrong) || 0);
  });
  var rIds = Object.keys(ERR.recall).filter(errRecallMatches).sort(function(a, b){
    return ((ERR.recall[b] && ERR.recall[b].missed) || 0) - ((ERR.recall[a] && ERR.recall[a].missed) || 0);
  });

  var html = '';

  if(tIds.length){
    html += '<section class="sec"><h2 class="sec-h"><span>Ошибки в тесте</span><span class="cnt">' + tIds.length + '</span></h2>';
    tIds.forEach(function(id){
      var t = TEST_BY_ID[id];
      if(!t) return;
      var opts = recallShuffle(t.opts.slice());
      ERR_VIEW[id] = { opts: opts, answered: false };
      var rec = ERR.test[id] || { wrong: 0 };
      var sec = CARD_TITLE[t.card] || '';
      html += '<div class="q" data-qid="' + esc(id) + '">';
      html += '<small>' + esc(sec) + ' · ' + esc(testSourceLabel(t)) + '</small>';
      html += '<h3>' + esc(t.stem) + '</h3>';
      html += '<div class="er-stats">Неверно: ' + (rec.wrong || 0) + ' раз</div>';
      html += '<div class="opts">';
      opts.forEach(function(o, i){
        html += '<button class="opt" type="button" data-i="' + i + '"><span class="opt-l">' + 'АБВГ'.charAt(i) + '</span><span class="opt-t">' + esc(o.t) + '</span></button>';
      });
      html += '</div>';
      html += '<div class="eres" hidden></div>';
      html += '</div>';
    });
    html += '</section>';
  }

  if(rIds.length){
    html += '<section class="sec"><h2 class="sec-h"><span>Формулировки «не знал»</span><span class="cnt">' + rIds.length + '</span></h2>';
    rIds.forEach(function(id){
      var it = RECALL_BY_ID[id];
      if(!it) return;
      var rec = ERR.recall[id] || { missed: 0 };
      html += '<div class="card" data-rid="' + esc(id) + '">';
      html += '<div class="card-t">' + esc(it.title) + '</div>';
      html += '<p class="err-meta">' + esc(it.secTitle) + ' · Не знал: ' + (rec.missed || 0) + ' раз</p>';
      html += '<textarea class="er-input" placeholder="Напишите формулировку своими словами"></textarea>';
      html += '<button class="btn alt er-check" type="button">Проверить</button>';
      html += '<div class="card-b er-body" hidden>' + it.html + '</div>';
      html += '<div class="row2 er-actions" hidden><button class="btn alt er-no" type="button">Не знал</button><button class="btn er-yes" type="button">Знал</button></div>';
      html += '</div>';
    });
    html += '</section>';
  }

  if(!html){
    var cAll = errCounts();
    html = '<div class="summary">' + (cAll.test + cAll.recall === 0
      ? 'Ошибок пока нет. Неверные ответы в тесте и формулировки, отмеченные «Не знал», появятся здесь автоматически.'
      : 'По этому фильтру ошибок нет.') + '</div>';
  }

  $('ebody').innerHTML = html;

  var cf = errCountsFiltered();
  var cTot = errCounts();
  if(errSec !== null){
    $('esum').textContent = 'Раздел «' + errSec + '»: ' + (cf.test + cf.recall) + ' ошибок · тест: ' + cf.test + ' · формулировки: ' + cf.recall + '.';
  } else {
    $('esum').textContent = 'Всего: ' + (cTot.test + cTot.recall) + ' · тест: ' + cTot.test + ' · формулировки «не знал»: ' + cTot.recall + '.';
  }
  updateErrorSummary();
}

});

$('ebody').addEventListener('click', function(e){
  var el = e.target;

  var optBtn = el.closest ? el.closest('.opt') : null;
  if(optBtn){
    var q = optBtn.closest('.q');
    if(!q) return;

    if(q.getAttribute('data-qid')){
      var qid = q.getAttribute('data-qid');
      var v = ERR_VIEW[qid];
      if(!v || v.answered) return;
      v.answered = true;
      var i = parseInt(optBtn.getAttribute('data-i'), 10);
      var o = v.opts[i];
      var ok = o.ok;
      var tq = TEST_BY_ID[qid];
      q.querySelectorAll('.opt').forEach(function(b, idx){
        if(v.opts[idx].ok) b.classList.add('ok');
        else if(b === optBtn) b.classList.add('bad');
      });
      var res = q.querySelector('.eres');
      res.hidden = false;
      if(ok){
        delete ERR.test[qid];
        errSave();
        var stats = q.querySelector('.er-stats');
        if(stats) stats.textContent = 'Верно — задание убрано из ошибок.';
        res.innerHTML = '<div class="card"><div class="card-t">✓ Верно — убрано из ошибок</div><p class="err-exp">' + esc(tq.exp) + '</p></div>';
        q.style.opacity = '0.35';
        q.style.transition = 'opacity .3s ease';
        updateErrorsBadge();
        setTimeout(function(){ errRender(); }, 800);
      } else {
        var rec = ERR.test[qid];
        if(!rec){ rec = ERR.test[qid] = { wrong: 0 }; }
        rec.wrong = (rec.wrong || 0) + 1;
        errSave();
        var stats2 = q.querySelector('.er-stats');
        if(stats2) stats2.textContent = 'Неверно: ' + (rec.wrong || 0) + ' раз';
        res.innerHTML = '<div class="card"><div class="card-t">✗ Неверно</div><p class="err-exp">' + esc((o.wrong ? o.wrong + ' ' : '') + tq.exp) + '</p><div class="card-b">' + (tq.cardObj ? tq.cardObj.html : '') + '</div></div>';
      }
      return;
    }

    if(errMode === 'one' && oneCur && oneCur.kind === 'test'){
      if(!oneView || oneView.answered) return;
      oneView.answered = true;
      var io = parseInt(optBtn.getAttribute('data-i'), 10);
      var oo = oneView.opts[io];
      var okk = oo.ok;
      var tqo = TEST_BY_ID[oneCur.id];
      q.querySelectorAll('.opt').forEach(function(b, idx){
        if(oneView.opts[idx].ok) b.classList.add('ok');
        else if(b === optBtn) b.classList.add('bad');
      });
      var reso = q.querySelector('.eres');
      reso.hidden = false;
      var nxt = $('onenext');
      if(okk){
        delete ERR.test[oneCur.id];
        errSave();
        oneScore++;
        reso.innerHTML = '<div class="card"><div class="card-t">✓ Верно — убрано из ошибок</div><p class="err-exp">' + esc(tqo.exp) + '</p></div>';
      } else {
        var reco = ERR.test[oneCur.id];
        if(!reco){ reco = ERR.test[oneCur.id] = { wrong: 0 }; }
        reco.wrong = (reco.wrong || 0) + 1;
        errSave();
        oneRequeueCurrent();
        reso.innerHTML = '<div class="card"><div class="card-t">✗ Неверно</div><p class="err-exp">' + esc((oo.wrong ? oo.wrong + ' ' : '') + tqo.exp) + '</p><div class="card-b">' + (tqo.cardObj ? tqo.cardObj.html : '') + '</div></div>';
      }
      if(nxt) nxt.hidden = false;
      updateErrorsBadge();
      return;
    }
    return;
  }

  var checkBtn = el.closest ? el.closest('.er-check') : null;
  if(checkBtn){
    var card = checkBtn.closest('.card');
    if(!card) return;
    var ta = card.querySelector('.er-input');
    var body = card.querySelector('.er-body');
    var actions = card.querySelector('.er-actions');
    if(ta) ta.readOnly = true;
    checkBtn.hidden = true;
    if(body) body.hidden = false;
    if(actions) actions.hidden = false;
    return;
  }

  var checkOne = el.closest ? el.closest('.er-check-one') : null;
  if(checkOne){
    var qc = checkOne.closest('.q');
    if(!qc) return;
    var taO = qc.querySelector('.er-input');
    var bodyO = qc.querySelector('.er-body-one');
    var actionsO = qc.querySelector('.one-actions');
    if(taO) taO.readOnly = true;
    checkOne.hidden = true;
    if(bodyO) bodyO.hidden = false;
    if(actionsO) actionsO.hidden = false;
    return;
  }

  var yesBtn = el.closest ? el.closest('.er-yes') : null;
  if(yesBtn){
    var cardY = yesBtn.closest('.card');
    var rid = cardY ? cardY.getAttribute('data-rid') : null;
    if(rid){
      delete ERR.recall[rid];
      errSave();
      updateErrorsBadge();
      errRender();
    }
    return;
  }

  var noBtn = el.closest ? el.closest('.er-no') : null;
  if(noBtn){
    var cardN = noBtn.closest('.card');
    var ridN = cardN ? cardN.getAttribute('data-rid') : null;
    if(ridN){
      var recN = ERR.recall[ridN];
      if(!recN){ recN = ERR.recall[ridN] = { missed: 0 }; }
      recN.missed = (recN.missed || 0) + 1;
      errSave();
      var meta = cardN.querySelector('.err-meta');
      if(meta){
        var itN = RECALL_BY_ID[ridN];
        if(itN) meta.textContent = itN.secTitle + ' · Не знал: ' + (recN.missed || 0) + ' раз';
      }
      updateErrorsBadge();
    }
    return;
  }

  if(el.id === 'onenext' || (el.closest && el.closest('#onenext'))){ oneAdvance(); return; }

  if(el.id === 'oneyes' || (el.closest && el.closest('#oneyes'))){
    if(oneCur && oneCur.kind === 'recall'){
      delete ERR.recall[oneCur.id];
      errSave();
      oneScore++;
      updateErrorsBadge();
    }
    oneAdvance();
    return;
  }

  if(el.id === 'oneno' || (el.closest && el.closest('#oneno'))){
    if(oneCur && oneCur.kind === 'recall'){
      var recNo = ERR.recall[oneCur.id];
      if(!recNo){ recNo = ERR.recall[oneCur.id] = { missed: 0 }; }
      recNo.missed = (recNo.missed || 0) + 1;
      errSave();
      oneRequeueCurrent();
    }
    oneAdvance();
    return;
  }
});

$('ereset').addEventListener('click', function(){
  if(!confirm('Сбросить все сохранённые ошибки? Это действие нельзя отменить.')) return;
  ERR.test = {};
  ERR.recall = {};
  errSave();
  errRender();
  updateErrorsBadge();
});

errLoad();
errRender();
updateErrorsBadge();
</script>
</body>
</html>
