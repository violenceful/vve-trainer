<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Введение в естествознание</title>
<style>
:root{
  --bg:#f2f5f7;--surf:#fff;--ink:#12283a;--mute:#5b6f7e;--line:#d5dfe6;
  --acc:#0b6f7a;--tag-bg:#e5eef2;--formula-bg:#f0f5f8;--accT:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a24;--surf:#16262f;--ink:#e6eef3;--mute:#92a7b4;--line:#2a3d49;
    --acc:#4fc3cf;--tag-bg:#1e3039;--formula-bg:#1a2b34;--accT:#06222a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a24;--surf:#16262f;--ink:#e6eef3;--mute:#92a7b4;--line:#2a3d49;
  --acc:#4fc3cf;--tag-bg:#1e3039;--formula-bg:#1a2b34;--accT:#06222a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding:16px 16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px}
.hdr h1{font:600 20px/1.2 ui-serif,Georgia,"Times New Roman",serif;margin:0;text-align:center;grid-column:2;min-width:0}
.authors{grid-column:1;justify-self:start;border:0;background:none;color:var(--mute);font:15px -apple-system,system-ui,sans-serif;min-height:44px;padding:0 4px;cursor:pointer;opacity:.75;text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.authors[aria-pressed="true"]{color:var(--acc);opacity:1}
.theme{grid-column:3;justify-self:end;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.theme:active{transform:scale(0.95)}

.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:0 14px;min-height:44px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surf);color:var(--ink);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.qsel{flex:1 1 200px;min-width:0;min-height:44px;font:16px -apple-system,system-ui,sans-serif;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.summary{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;color:var(--mute);font-size:14px}

.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font:600 18px/1.3 ui-serif,Georgia,serif;color:var(--acc)}
.cnt{font:600 12px -apple-system,system-ui,sans-serif;color:var(--mute);background:var(--tag-bg);padding:2px 8px;border-radius:99px;letter-spacing:0;white-space:nowrap}

.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card-t{font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:var(--ink);margin:0 0 8px}
.card-b{font:17px/1.5 ui-serif,Georgia,"Times New Roman",serif;color:var(--ink)}
.card-b b{font-weight:700;color:var(--acc)}
.card-b ul,.card-b ol{margin:6px 0 6px 0;padding-left:22px}
.card-b li{margin:3px 0}
.card-b .sub{font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:var(--acc);margin:12px 0 4px}

.formula{display:block;text-align:center;margin:10px 0;padding:8px 6px;background:var(--formula-bg);border-radius:8px;font:17px/1.5 ui-serif,Georgia,"Times New Roman",serif;overflow-x:auto}

.q small{display:block;color:var(--mute);font:14px -apple-system,system-ui,sans-serif;margin-bottom:6px}
.q h3{margin:0;font:600 17px/1.35 ui-serif,Georgia,"Times New Roman",serif;color:var(--ink)}
.q{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:4px}
textarea{width:100%;box-sizing:border-box;font:17px/1.45 -apple-system,system-ui,sans-serif;background:var(--surf);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;resize:vertical;min-height:110px}
textarea::placeholder{color:var(--mute)}
textarea:focus{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;border:0;background:var(--acc);color:var(--accT);font:600 17px -apple-system,system-ui,sans-serif;padding:14px;border-radius:12px;margin-top:10px;cursor:pointer}
.btn:active{opacity:.9}
.btn.alt{background:var(--surf);color:var(--ink);border:1.5px solid var(--line)}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 .btn{flex:1;margin-top:0}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:44px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);font:17px/1.4 ui-serif,Georgia,"Times New Roman",serif;cursor:pointer;word-wrap:break-word}
.opt:active{opacity:.9}
.opt-l{flex:0 0 auto;font:600 14px -apple-system,system-ui,sans-serif;color:var(--mute);padding-top:3px}
.opt-t{flex:1 1 auto;min-width:0}
.opt.ok{border-color:#1a7f4b;background:rgba(26,127,75,.14)}
.opt.bad{border-color:#b3261e;background:rgba(179,38,30,.14)}
#xres .card{margin-top:12px;margin-bottom:0}
#xhead{font-size:17px;margin-bottom:8px}
#xtrap{font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--mute);margin:8px 0 0;white-space:pre-line}

.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:var(--accT);font-size:12px;font-weight:600;flex-shrink:0;vertical-align:middle}
.err-meta{margin:2px 0 10px;font:14px/1.4 -apple-system,system-ui,sans-serif;color:var(--mute)}
.er-stats{margin:6px 0 8px;font:14px/1.4 -apple-system,system-ui,sans-serif;color:var(--mute)}
.eres{margin-top:12px}
.eres .card{margin-top:0;margin-bottom:0}
.eres .card-b{margin-top:8px}
.err-exp{margin:8px 0 0;font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--ink);white-space:pre-line}
#ebody .q{margin-bottom:12px}

.thanks{margin:24px 0;padding:32px 22px;text-align:center;background:var(--surf);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.06);animation:thanksIn .5s ease both}
.thanks-t{margin:0;font:600 20px/1.35 ui-serif,Georgia,"Times New Roman",serif;color:var(--ink)}
.thanks-sub{margin:14px 0 0;font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--mute);word-break:break-word}
.thanks-sub a{color:var(--acc);text-decoration:none}
.thanks-sub a:hover{text-decoration:underline}
@keyframes thanksIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.thanks{animation:none}}

@media (max-width:360px){
  .hdr h1{font-size:17px}
  .card{padding:12px}
  .card-b{font-size:16px}
  .formula{font-size:15px;padding:7px 4px}
}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <button id="authors" class="authors" type="button" aria-pressed="false">От авторов</button>
    <h1>Введение в естествознание</h1>
    <button id="theme" class="theme" type="button" aria-label="Переключить тему">🌙</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Режимы">
    <button role="tab" id="tab-ref" aria-controls="ref-view" aria-selected="true" type="button" data-tab="ref">Конспект</button>
    <button role="tab" id="tab-recall" aria-controls="recall" aria-selected="false" type="button" data-tab="recall">Формулировки</button>
    <button role="tab" id="tab-test" aria-controls="testview" aria-selected="false" type="button" data-tab="test">Тест</button>
    <button role="tab" id="tab-errors" aria-controls="errorsview" aria-selected="false" type="button" data-tab="errors">Ошибки<span class="badge" id="errcnt" hidden>0</span></button>
  </nav>
  <div id="ref-view" role="tabpanel" aria-labelledby="tab-ref">
    <div class="chips" id="chips" aria-label="Фильтр по разделу"></div>
    <div class="tools"><select id="qsel" class="qsel" aria-label="Фильтр по вопросу экзамена"></select></div>
    <div class="summary" id="sum"></div>
    <main id="ref" aria-label="Конспект"></main>
  </div>
  <section id="recall" hidden role="tabpanel" aria-labelledby="tab-recall" aria-label="Формулировки">
    <div class="chips" id="rchips" aria-label="Фильтр по разделу"></div>
    <div class="tools">
      <select id="rqsel" class="qsel" aria-label="Фильтр по вопросу экзамена"></select>
      <button class="chip" id="rorder" type="button">Порядок: случайно</button>
    </div>
    <div class="summary" id="rsum"></div>
    <div class="q">
      <small id="rsec"></small>
      <h3 id="rtitle"></h3>
    </div>
    <textarea id="rinput" rows="5" placeholder="Напишите формулировку своими словами"></textarea>
    <button class="btn" id="rcheck" type="button">Показать ответ</button>
    <button class="btn alt" id="rrestart" type="button" hidden>Начать заново</button>
    <div id="rresult" hidden>
      <div class="card">
        <div class="card-t">Эталонная формулировка</div>
        <div class="card-b" id="rresult-body"></div>
      </div>
      <div class="row2">
        <button class="btn alt" id="rno" type="button">Не знал</button>
        <button class="btn" id="ryes" type="button">Знал</button>
      </div>
    </div>
  </section>
  <section id="aview" hidden aria-label="От авторов">
    <div class="thanks">
      <p class="thanks-t">Спасибо, что пользуетесь этим тренажёром!</p>
      <p class="thanks-sub">Предложения по улучшению: <a href="mailto:violenceful@gmail.com">violenceful@gmail.com</a></p>
    </div>
  </section>
  <section id="testview" hidden role="tabpanel" aria-labelledby="tab-test" aria-label="Тест">
    <div class="chips" id="xchips" aria-label="Фильтр по разделу"></div>
    <div class="tools"><select id="xqsel" class="qsel" aria-label="Фильтр по вопросу экзамена"></select></div>
    <div class="summary" id="xsum"></div>
    <div class="q">
      <small id="xsec"></small>
      <h3 id="xstem"></h3>
    </div>
    <div class="opts" id="xopts"></div>
    <div id="xres" hidden aria-live="polite">
      <div class="card">
        <div class="card-t" id="xhead"></div>
        <div id="xtrap"></div>
        <div class="card-b" id="xres-body"></div>
      </div>
      <button class="btn" id="xnext" type="button">Дальше</button>
    </div>
    <button class="btn alt" id="xrestart" type="button" hidden>Пройти заново</button>
  </section>
  <section id="errorsview" hidden role="tabpanel" aria-labelledby="tab-errors" aria-label="Мои ошибки">
    <div class="chips" id="echips" aria-label="Фильтр по разделу"></div>
    <div class="tools"><button class="chip" id="eorder" type="button">Режим: список</button></div>
    <div class="summary" id="esum"></div>
    <div id="ebody"></div>
    <button class="btn alt" id="ereset" type="button" hidden>Сбросить ошибки</button>
  </section>
</div>

<script>
'use strict';
var SECTIONS = [
 {
  "title": "Научная картина мира",
  "short": "Картина мира",
  "items": [
   {
    "id": "v01",
    "q": [1],
    "title": "Вопрос 1. Важнейшие проблемы естествознания",
    "html": "<p>Естествознание отвечает на четыре группы фундаментальных вопросов.</p>" +
     "<div class='sub'>1. Как устроено вещество?</div>" +
     "<p>Изучение структуры и свойств материи на всех уровнях: от элементарных частиц и атомов до молекул, сложных соединений и макроскопических объектов. Важнейшие нерешённые проблемы: природа тёмной материи, природа тёмной энергии, построение квантовой теории гравитации, создание новых материалов с заданными свойствами.</p>" +
     "<div class='sub'>2. Где, в пространстве и во времени, мы находимся? Как они возникли?</div>" +
     "<p>Положение Земли и Солнечной системы во Вселенной, её структура, происхождение и эволюция. Ключевые направления: Большой взрыв, расширение Вселенной, формирование галактик, звёзд, планетных систем и происхождение Земли.</p>" +
     "<div class='sub'>3. Что такое жизнь и как она возникла?</div>" +
     "<p>Характерные свойства живых систем, определение понятия жизни и механизмы её возникновения из неживой материи. Основное направление — гипотеза абиогенеза (химической эволюции): постепенное образование органических молекул, биополимеров, самовоспроизводящихся систем и первых клеток.</p>" +
     "<div class='sub'>4. Что такое сознание? Как оно возникло? Каково происхождение человека?</div>" +
     "<p>Природа сознания, его связь с деятельностью мозга, психическими процессами, языком и общественной жизнью человека. Происхождение человека изучается в рамках биологической и культурной эволюции. Современный человек и современные человекообразные обезьяны имеют общих эволюционных предков, а не происходят друг от друга.</p>"
   },
   {
    "id": "v02",
    "q": [2],
    "title": "Вопрос 2. Основные научные открытия современной картины мира",
    "html": "<div class='sub'>Астрономия и космология</div>" +
     "<ul>" +
     "<li>Гелиоцентрическая система мира — Н. Коперник; наблюдательные подтверждения — Галилей.</li>" +
     "<li>Законы движения планет — И. Кеплер.</li>" +
     "<li>Закон всемирного тяготения — И. Ньютон.</li>" +
     "<li>Расширение Вселенной — наблюдательная связь расстояний до галактик с их красными смещениями (Э. Хаббл). Теоретическое предсказание расширяющейся Вселенной сделано ранее А. Фридманом и Ж. Леметром.</li>" +
     "<li>Открытие экзопланет у звёзд главной последовательности — М. Майор и Д. Кело, 1995 год.</li>" +
     "<li>Экспериментальное обнаружение гравитационных волн — LIGO, событие GW150914, зарегистрировано в 2015 году и объявлено в 2016 году. Подтвердило одно из важнейших предсказаний общей теории относительности.</li>" +
     "</ul>" +
     "<div class='sub'>Физика</div>" +
     "<ul>" +
     "<li>Классическая механика и развитие математического анализа — И. Ньютон и Г. Лейбниц.</li>" +
     "<li>Теория электромагнитного поля — М. Фарадей и Дж. Максвелл.</li>" +
     "<li>Специальная и общая теории относительности — А. Эйнштейн.</li>" +
     "<li>Квантовая теория — М. Планк, А. Эйнштейн и другие.</li>" +
     "<li>Квантовая механика — в частности, волновое уравнение Э. Шрёдингера.</li>" +
     "<li>Статистическая физика и молекулярно-кинетическая теория — Л. Больцман и другие.</li>" +
     "</ul>" +
     "<div class='sub'>Химия</div>" +
     "<ul>" +
     "<li>Периодический закон и периодическая система химических элементов — Д. И. Менделеев.</li>" +
     "<li>Развитие термодинамики и статистической физики, установившее связь между макроскопическими свойствами веществ и поведением частиц.</li>" +
     "</ul>" +
     "<p>Необходимо различать вклад Больцмана в статистическую физику и развитие термодинамики как отдельной научной дисциплины.</p>" +
     "<div class='sub'>Биология и эволюция</div>" +
     "<ul>" +
     "<li>Клеточная теория — М. Шлейден и Т. Шванн; позднее дополнена Р. Вирховом.</li>" +
     "<li>Теория эволюции посредством естественного отбора — Ч. Дарвин.</li>" +
     "<li>Открытие ДНК как носителя наследственной информации и установление её структуры — важнейшие этапы молекулярной биологии. Двойная спираль ДНК предложена Дж. Уотсоном и Ф. Криком в 1953 году.</li>" +
     "<li>Установление роли РНК в реализации генетической информации и синтезе белка.</li>" +
     "<li>Наблюдение микроорганизмов, включая бактерии, — А. Левенгук.</li>" +
     "<li>Создание научной систематики и развитие биноминальной номенклатуры — К. Линней.</li>" +
     "</ul>" +
     "<div class='sub'>Технические и прикладные достижения</div>" +
     "<p>Эти достижения не следует смешивать с фундаментальными научными открытиями, однако они существенно изменили возможности науки и общества: создание первого транзистора (1947), запуск первого искусственного спутника Земли (1957), развитие компьютерных сетей и создание Интернета.</p>" +
     "<p>Важно: не все перечисленные достижения являются открытиями одного человека. В ряде случаев речь идёт о длительном развитии научного направления.</p>"
   }
  ]
 },
 {
  "title": "Материя и законы сохранения",
  "short": "Материя",
  "items": [
   {
    "id": "v03",
    "q": [3],
    "title": "Вопрос 3. «Кирпичики», из которых состоит материя",
    "html": "<p>Материя имеет различные уровни организации — от элементарных частиц до сложных материальных систем.</p>" +
     "<div class='sub'>1. Фундаментальные частицы</div>" +
     "<ul><li>кварки;</li><li>лептоны (электрон, мюон, тау-частица и соответствующие нейтрино);</li><li>переносчики фундаментальных взаимодействий.</li></ul>" +
     "<p>Протоны и нейтроны являются составными частицами, образованными кварками, а электроны относятся к элементарным частицам.</p>" +
     "<div class='sub'>2. Атомно-молекулярный уровень</div>" +
     "<ul><li>атомы — структурные единицы химических элементов;</li><li>молекулы — частицы, состоящие из химически связанных атомов;</li><li>химические соединения;</li><li>кристаллы и другие конденсированные структуры;</li><li>биологические макромолекулы и биополимеры.</li></ul>" +
     "<p>На 2016 год официально признавались 118 химических элементов; элемент с атомным номером 118 — оганесон.</p>" +
     "<div class='sub'>3. Биологический уровень</div>" +
     "<ul><li>клетки;</li><li>одноклеточные и многоклеточные организмы;</li><li>биологические виды;</li><li>популяции;</li><li>биоценозы;</li><li>экосистемы;</li><li>биосфера.</li></ul>" +
     "<div class='sub'>4. Геологический уровень</div>" +
     "<ul><li>минералы;</li><li>горные породы;</li><li>геологические структуры и формации;</li><li>Земля как планета.</li></ul>" +
     "<div class='sub'>5. Астрономический и космологический уровни</div>" +
     "<ul><li>планеты и экзопланеты;</li><li>звёзды;</li><li>молекулярные облака;</li><li>галактики;</li><li>скопления и сверхскопления галактик;</li><li>крупномасштабная структура Вселенной;</li><li>Вселенная в целом.</li></ul>" +
     "<div class='sub'>6. Макроскопические и социальные системы</div>" +
     "<ul><li>физические тела;</li><li>человек как биологический организм;</li><li>человеческие сообщества и общественные системы.</li></ul>" +
     "<div class='sub'>Космологическое распределение вещества и энергии</div>" +
     "<ul><li>обычная (барионная) материя — около 4,6%;</li><li>тёмная материя — около 23%;</li><li>тёмная энергия — около 72%.</li></ul>" +
     "<p>Эти величины характеризуют приблизительное распределение плотности массы-энергии Вселенной, а не количество атомов или отдельных «кирпичиков» материи. Тёмная материя и тёмная энергия также не являются разновидностями атомов.</p>"

   {
    "id": "v04",
    "q": [4],
    "title": "Вопрос 4. Фундаментальные законы сохранения",
    "html": "<div class='sub'>1. Закон сохранения энергии</div>" +
     "<p>Энергия не возникает и не исчезает, а только переходит из одной формы в другую или передаётся между телами. Для изолированной системы её полная энергия сохраняется.</p>" +
     "<div class='sub'>2. Сохранение массы и энергии</div>" +
     "<p>В классической механике и химических реакциях масса замкнутой системы практически рассматривается как сохраняющаяся величина. Однако в релятивистской физике масса и энергия взаимосвязаны соотношением E = mc². Масса покоя отдельных частиц и тел может изменяться при превращениях, сопровождающихся выделением или поглощением энергии. Поэтому фундаментально следует говорить о сохранении полной энергии системы, а не об абсолютном сохранении массы как отдельной величины.</p>" +
     "<div class='sub'>3. Закон сохранения импульса</div>" +
     "<p>Векторная сумма импульсов всех тел системы сохраняется, если равнодействующая внешних сил равна нулю.</p>" +
     "<div class='sub'>4. Закон сохранения момента импульса</div>" +
     "<p>Полный момент импульса изолированной системы сохраняется, если суммарный внешний момент сил относительно рассматриваемой точки равен нулю. Иначе говоря, изменение момента импульса определяется действием внешнего момента сил.</p>" +
     "<div class='sub'>5. Закон сохранения электрического заряда</div>" +
     "<p>Алгебраическая сумма электрических зарядов электрически замкнутой системы сохраняется.</p>" +
     "<div class='sub'>6. Барионное число</div>" +
     "<p>Барионное число — квантовое число, характеризующее барионный состав системы. Барионам (например, протонам и нейтронам) приписывается барионное число +1, антибарионам −1, для других частиц оно равно нулю. Барионы относятся к адронам; протоны и нейтроны представляют собой частицы, состоящие из трёх валентных кварков.</p>" +
     "<p>Сохранение барионного числа выполняется в обычных наблюдаемых низкоэнергетических процессах, однако в некоторых расширениях и квантовых теориях поля рассматриваются процессы, в которых оно может нарушаться.</p>" +
     "<div class='sub'>7. Лептонное число</div>" +
     "<p>Лептоны — фундаментальные частицы со спином 1/2: электрон, мюон, тау-лептон и соответствующие нейтрино (электронное, мюонное, тау). Соответствующим античастицам приписывается противоположное лептонное число.</p>" +
     "<p>При нейтринных осцилляциях меняется аромат нейтрино, поэтому отдельные лептонные числа ароматов нельзя считать безусловно сохраняющимися величинами.</p>" +
     "<div class='sub'>8. CPT-теорема</div>" +
     "<p>CPT-теорема — фундаментальная теорема квантовой теории поля, согласно которой при определённых условиях физические законы инвариантны относительно одновременного выполнения трёх преобразований:</p>" +
     "<ul><li>C (Charge conjugation) — зарядовое сопряжение: замена частиц соответствующими античастицами;</li><li>P (Parity) — пространственная инверсия: изменение знаков всех пространственных координат, r → −r;</li><li>T (Time reversal) — обращение времени: замена направления времени, t → −t.</li></ul>" +
     "<p>CPT-теорема не является законом сохранения отдельной физической величины. Она описывает фундаментальную симметрию физических законов.</p>"
   }
  ]
 },

    "title": "Вопрос 5. Развитие Вселенной от Большого взрыва до современности",
    "html": "<p>Возраст Вселенной составляет приблизительно 13,8 млрд лет. Большой взрыв — это не обычный взрыв вещества в уже существовавшем пространстве, а модель расширения Вселенной из чрезвычайно горячего и плотного раннего состояния.</p>" +
     "<div class='sub'>Основные этапы</div>" +
     "<ol>" +
     "<li><b>Раннее состояние.</b> Вселенная находилась в чрезвычайно горячем и плотном состоянии. По мере расширения температура и плотность вещества снижались.</li>" +
     "<li><b>Эпоха космологической инфляции.</b> В рамках инфляционной модели предполагается чрезвычайно быстрое расширение Вселенной на раннем этапе её существования. Это могло объяснить наблюдаемую однородность и крупномасштабную геометрию Вселенной. Инфляция является теоретической моделью ранней Вселенной.</li>" +
     "<li><b>Формирование частиц и асимметрии между веществом и антивеществом.</b> В ранней Вселенной происходили процессы образования и взаимодействия элементарных частиц. В результате возникла наблюдаемая асимметрия между количеством вещества и антивещества. Точный механизм возникновения этой асимметрии до конца не установлен.</li>" +
     "<li><b>Первичный нуклеосинтез (первые минуты).</b> В результате ядерных реакций образовались лёгкие атомные ядра: водорода (протоны), дейтерия, гелия, небольшого количества лития. По массе первичное вещество состояло преимущественно из водорода и гелия.</li>" +
     "<li><b>Рекомбинация (примерно через 380 тыс. лет).</b> Электроны начали связываться с атомными ядрами, образовались преимущественно нейтральные атомы водорода и гелия. Вселенная стала прозрачной для излучения; фотоны, освободившиеся в этот период, наблюдаются сегодня как реликтовое излучение.</li>" +
     "<li><b>Эпоха тёмных веков.</b> После рекомбинации и до появления первых звёзд Вселенная была заполнена преимущественно нейтральным газом.</li>" +
     "<li><b>Появление первых звёзд и галактик.</b> Под действием гравитации газовые облака сжимались, формируя первые звёзды (население III). В дальнейшем происходило формирование первых галактик и постепенная реионизация межгалактического газа.</li>" +
     "<li><b>Звёздный нуклеосинтез.</b> В недрах звёзд происходили реакции ядерного синтеза, в ходе которых из более лёгких элементов образовывались более тяжёлые, в том числе углерод, кислород и элементы группы железа.</li>" +
     "<li><b>Образование Солнечной системы (примерно 4,6 млрд лет назад).</b> Из газопылевого облака сформировались Солнце и окружающий его протопланетный диск; в процессе аккреции вещества образовались планеты. На момент формирования Солнечной системы возраст Вселенной составлял приблизительно 9,2 млрд лет.</li>" +
     "<li><b>Возникновение жизни на Земле.</b> Жизнь возникла в далёком геологическом прошлом; в конспекте используется ориентировочная оценка около 3,8 млрд лет назад. Точный путь возникновения первых живых систем остаётся предметом научных исследований.</li>" +
     "<li><b>Современная эпоха.</b> Вселенная продолжает расширяться, причём её расширение ускоряется. В современной космологической модели это ускорение связывают с тёмной энергией. Интенсивность звездообразования во Вселенной в среднем снижается по сравнению с её максимумом в прошлом.</li>" +
     "</ol>"

   {

    "title": "Вопрос 6. Где мы находимся во времени и пространстве",
    "html": "<div class='sub'>Современное понимание: в пространстве</div>" +
     "<p>Земля → Солнечная система → галактика Млечный Путь (рукав Ориона, или Местный рукав) → Местная группа галактик → сверхскопление Ланиакея.</p>" +
     "<p>Скопление Девы находится в составе Ланиакеи и является одной из её главных структур. Его нельзя просто помещать в последовательную цепочку между Местной группой и Ланиакеей.</p>" +
     "<div class='sub'>Во времени</div>" +
     "<ul><li>возраст Вселенной — около 13,8 млрд лет;</li><li>возраст Солнечной системы — около 4,6 млрд лет;</li><li>возраст Земли — около 4,54 млрд лет;</li><li>возраст древнейших свидетельств жизни на Земле — несколько миллиардов лет (в конспекте используется оценка около 3,8 млрд лет);</li><li>современный человек (Homo sapiens) существует примерно 200–300 тыс. лет.</li></ul>" +
     "<p>Земля находится в кайнозойской эре, а современная геологическая эпоха в традиционной геохронологической шкале — голоцен.</p>" +
     "<div class='sub'>Эволюция представлений</div>" +
     "<ol>" +
     "<li><b>Античность — Средневековье: геоцентрическая картина мира.</b> Землю считали центральным неподвижным телом, вокруг которого движутся небесные тела. Основные представители античной геоцентрической системы — Аристотель и Клавдий Птолемей. Представления основывались на наблюдениях видимого движения небесных тел и философских моделях устройства мира.</li>" +
     "<li><b>XVI–XVII века: коперниканская революция.</b> Н. Коперник предложил гелиоцентрическую систему, согласно которой Земля и другие планеты обращаются вокруг Солнца. Важные подтверждения и развитие этой картины: наблюдение фаз Венеры Галилеем, открытие спутников Юпитера, формулировка законов движения планет Кеплером.</li>" +
     "<li><b>Конец XVII–XIX века: ньютоновская картина мира.</b> И. Ньютон сформулировал законы механики и всемирного тяготения. Стало возможным объяснять движения небесных тел с помощью универсальных физических законов. Открытие Урана и Нептуна также продемонстрировало возможности теоретической небесной механики. Ньютоновская механика сама по себе не доказывала, что Вселенная бесконечна и статична: это были отдельные космологические представления своего времени.</li>" +
     "<li><b>XX век: космологическая революция.</b> Установление того, что многие наблюдаемые туманности являются отдельными галактиками; исследование связи красного смещения галактик с расстоянием до них; развитие моделей расширяющейся Вселенной; развитие теории Большого взрыва; открытие реликтового излучения А. Пензиасом и Р. Уилсоном в 1965 году.</li>" +
     "<li><b>Конец XX — XXI век.</b> Открытие ускоренного расширения Вселенной (по астрономическим наблюдениям, опубликованным в 1998 году); исследование тёмной материи по её гравитационному воздействию; обнаружение экзопланет; развитие наблюдательной космологии и уточнение возраста Вселенной.</li>" +
     "</ol>" +
     "<p>Тёмная материя и тёмная энергия — разные космологические компоненты, их не следует отождествлять.</p>"

    "title": "Вопрос 9. Происхождение химических элементов",
    "html": "<p>Химические элементы образовались в результате ядерных реакций, происходивших на разных этапах эволюции Вселенной.</p>" +
     "<div class='sub'>1. Первичный нуклеосинтез</div>" +
     "<p>Во время ранних этапов существования Вселенной образовались преимущественно ядра водорода и гелия, а также небольшие количества некоторых лёгких элементов.</p>" +
     "<div class='sub'>2. Звёздный нуклеосинтез</div>" +
     "<p>В недрах звёзд протекают реакции ядерного синтеза, в результате которых из более лёгких ядер образуются более тяжёлые. Основные процессы:</p>" +
     "<ul><li>превращение водорода в гелий;</li><li>образование углерода;</li><li>образование кислорода и других элементов;</li><li>образование элементов группы железа в звёздах соответствующих масс и на поздних стадиях звёздной эволюции.</li></ul>" +
     "<div class='sub'>3. Образование элементов тяжелее железа</div>" +
     "<p>Элементы тяжелее железной группы образуются преимущественно посредством процессов захвата нейтронов и других ядерных реакций, происходящих в особых астрофизических условиях. Среди механизмов образования тяжёлых элементов выделяют медленный и быстрый захват нейтронов. Образовавшиеся элементы распространяются в космическое пространство благодаря звёздным ветрам, взрывам сверхновых и другим астрофизическим процессам.</p>" +
     "<div class='sub'>Почему элементы тяжелее железа встречаются реже?</div>" +
     "<p>В районе железа и никеля наблюдается максимальная энергия связи на нуклон. При синтезе ядер, более тяжёлых, чем железная группа, выделение энергии за счёт обычного термоядерного слияния становится энергетически невыгодным. Поэтому образование таких элементов требует других ядерных процессов и особых условий, которые возникают значительно реже. В результате элементы тяжелее железа в среднем имеют меньшую распространённость, чем водород, гелий и многие элементы, образующиеся в звёздах при термоядерном синтезе.</p>" +
     "<p>Важно: тяжёлые элементы нельзя называть просто «шлаком термоядерных звёздных реакторов» — это образное выражение не объясняет реальные механизмы их образования. Также звезда не обязательно прекращает существование сразу после появления железа: дальнейшая эволюция зависит от её массы и внутреннего строения.</p>"

    "q": [7],
    "title": "Вопрос 7. Научные дисциплины о сознании и его историческое развитие",
    "html": "<div class='sub'>Научные дисциплины</div>" +
     "<ul>" +
     "<li><b>Психология</b> — исследует психические процессы, восприятие, память, мышление, эмоции и поведение человека.</li>" +
     "<li><b>Нейробиология и нейрофизиология</b> — изучают деятельность нервной системы, работу головного мозга и биологические механизмы, связанные с психическими процессами.</li>" +
     "<li><b>Когнитивная наука</b> — исследует познавательные процессы: восприятие, память, внимание, мышление, язык и принятие решений.</li>" +
     "<li><b>Антропология</b> — изучает человека, его биологическую и культурную эволюцию, развитие поведения и социальных форм жизни.</li>" +
     "<li><b>Философия сознания</b> — рассматривает вопросы природы сознания, соотношения сознания и материи, субъективного опыта и проблемы познания. Её следует отличать от экспериментальных естественнонаучных дисциплин: она исследует прежде всего концептуальные и мировоззренческие проблемы.</li>" +
     "</ul>" +
     "<div class='sub'>Определение сознания</div>" +
     "<p>В рамках представленного учебного подхода сознание рассматривается как высшая форма психического отражения действительности, связанная с деятельностью человеческого мозга, речью, трудом и общественно-историческим развитием человека. При этом вопрос о природе сознания остаётся предметом научных и философских дискуссий.</p>" +
     "<p>Утверждение, что сознание безусловно присуще исключительно человеку, слишком категорично: вопрос о формах и степени сознательного опыта у животных требует отдельного рассмотрения.</p>" +
     "<div class='sub'>Историческое развитие представлений и форм сознания</div>" +
     "<ol>" +
     "<li><b>Древнейшее время — мифологическое сознание.</b> Объяснение окружающего мира и основных явлений природы происходило преимущественно посредством мифологических представлений.</li>" +
     "<li><b>Античность — Средневековье.</b> Развитие индивидуального сознания, философского познания, религиозных представлений и форм обучения. Важное значение приобрело монотеистическое мировоззрение как способ объяснения основных вопросов бытия.</li>" +
     "<li><b>Возрождение — Новое время — современность.</b> Развитие научного познания, экспериментальных методов исследования, новых технологий и естественнонаучной картины мира. Происходит становление науки как особого вида общественной деятельности и её взаимодействие с государством, образованием и культурой.</li>" +
     "</ol>" +
     "<p>Важно: это историко-культурная периодизация из программы курса, а не универсальная последовательность биологических стадий развития сознания отдельного человека.</p>"
   }
  ]
 },
 {

   {
    "id": "v08",
    "q": [8],
    "title": "Вопрос 8. Взгляды на происхождение жизни",
    "html": "<p>В программе курса рассматриваются три основных подхода: креационизм, панспермия и абиогенез.</p>" +
     "<div class='sub'>1. Креационизм</div>" +
     "<p>Представление о происхождении жизни в результате деятельности сверхъестественного творца. Особенность: объяснение возникновения жизни связывается с действием сверхъестественной причины. Ограничение: в такой форме концепция не предоставляет естественнонаучного механизма, который можно было бы экспериментально проверить и воспроизвести.</p>" +
     "<div class='sub'>2. Панспермия</div>" +
     "<p>Гипотеза, согласно которой жизнь или её предшественники могли попасть на Землю из космоса. В пользу возможности существования органических веществ за пределами Земли свидетельствуют данные об обнаружении органических соединений в космических объектах.</p>" +
     "<p>Сильная сторона: допускает возможность переноса органических веществ и, в некоторых вариантах, живых организмов между космическими телами. Слабая сторона: не объясняет первоначальное возникновение жизни, а переносит проблему её происхождения за пределы Земли.</p>" +
     "<div class='sub'>3. Абиогенез (химическая эволюция)</div>" +
     "<p>Гипотеза предполагает, что жизнь возникла из неживой материи в результате последовательных физико-химических процессов. Одним из основоположников представлений о химической эволюции является А. И. Опарин; аналогичные идеи независимо развивал Дж. Холдейн. В рамках этой концепции выделяют несколько основных этапов:</p>" +
     "<ol><li>абиогенный синтез простых органических соединений;</li><li>образование более сложных органических молекул и биополимеров;</li><li>формирование обособленных молекулярных систем и мембранных структур;</li><li>появление систем, способных к самовоспроизведению, наследственной изменчивости и обмену веществ;</li><li>возникновение первых клеточных организмов.</li></ol>" +
     "<p>Эти этапы представляют собой исследуемую модель химической эволюции, а не полностью установленную последовательность исторических событий.</p>" +
     "<div class='sub'>Гипотеза «Мира РНК»</div>" +
     "<p>Одно из важнейших направлений исследований абиогенеза. Предполагается, что РНК могла выполнять одновременно две основные функции: хранить наследственную информацию и катализировать химические реакции. В пользу этой гипотезы свидетельствует существование рибозимов — молекул РНК с каталитической активностью. Однако происхождение самой РНК, её полимеризация и появление самовоспроизводящихся систем остаются нерешёнными проблемами.</p>" +
     "<div class='sub'>Коацерваты и липосомы как модели предклеточных структур</div>" +
     "<p>Коацерваты — обособленные капли, возникающие при разделении компонентов раствора на фазы. Они могут концентрировать определённые вещества и обеспечивать их взаимодействие. Однако коацерваты не являются полноценными клетками, не обладают доказанной наследственной системой, не обязательно имеют липидную мембрану и не обладают полноценным самостоятельным метаболизмом.</p>" +
     "<p>Липосомы — пузырьки, образованные липидным бислоем; они представляют собой более подходящую модель мембранных компартментов. Следует различать коацерваты и липосомы: это разные типы моделей протоклеточных структур.</p>" +
     "<div class='sub'>Сильные стороны абиогенеза</div>" +
     "<ul><li>предлагает естественнонаучный подход к объяснению происхождения жизни;</li><li>допускает экспериментальную проверку отдельных этапов;</li><li>подтверждается опытами по абиогенному синтезу органических веществ;</li><li>позволяет исследовать образование биополимеров, мембранных структур и систем самоорганизации.</li></ul>" +
     "<div class='sub'>Слабые стороны и нерешённые проблемы</div>" +
     "<ul><li>не установлен полный путь от простых веществ до первой самовоспроизводящейся системы;</li><li>не решена проблема происхождения генетического кода;</li><li>не установлены точные условия образования первых биополимеров;</li><li>не полностью понятны механизмы возникновения наследственности, обмена веществ и клеточной организации.</li></ul>" +
     "<p>Вывод: абиогенез представляет собой основное направление естественнонаучного исследования происхождения жизни, но завершённая экспериментально подтверждённая теория возникновения первой клетки пока отсутствует.</p>"
   },
   {
    "id": "v10",
    "q": [10],
    "title": "Вопрос 10. Эксперимент Миллера — Юри",
    "html": "<div class='sub'>Цель эксперимента</div>" +
     "<p>Проверить, могут ли органические соединения образовываться абиогенным путём из простых исходных веществ в условиях, моделирующих некоторые предполагаемые условия ранней Земли. Эксперимент был связан с гипотезой химической эволюции Опарина — Холдейна.</p>" +
     "<div class='sub'>Схема эксперимента</div>" +
     "<p>Использовалась герметичная установка с непрерывным циклом:</p>" +
     "<ol><li>вода нагревалась и испарялась;</li><li>водяной пар поступал в камеру с газовой смесью;</li><li>в газовой смеси создавались электрические разряды, имитирующие молнии;</li><li>продукты реакций охлаждались и конденсировались;</li><li>жидкость возвращалась в нагреваемую часть установки.</li></ol>" +
     "<p>В исходном эксперименте использовалась смесь: CH₄ (метан), NH₃ (аммиак), H₂ (водород), H₂O (водяной пар). Эта смесь моделировала восстановительную атмосферу.</p>" +
     "<div class='sub'>Основные результаты</div>" +
     "<p>В ходе эксперимента были получены различные органические соединения, в том числе аминокислоты, карбоновые кислоты, мочевина и другие. Среди обнаруженных аминокислот были глицин, аланин и другие представители.</p>" +
     "<div class='sub'>Значение эксперимента</div>" +
     "<p>Эксперимент показал принципиальную возможность образования органических соединений абиогенным путём из более простых исходных веществ. Он стал важным подтверждением возможности одного из этапов химической эволюции.</p>" +
     "<p>Однако эксперимент не воспроизвёл полностью реальные условия ранней Земли, не доказал возникновение жизни, не продемонстрировал образование полноценных биополимеров и самовоспроизводящихся клеток.</p>" +
     "<div class='sub'>Основные проблемы абиогенного синтеза</div>" +
     "<ol>" +
     "<li><b>Состав первичной атмосферы.</b> В эксперименте использовалась сильно восстановительная газовая смесь. Однако состав реальной ранней атмосферы Земли остаётся предметом исследований: нельзя автоматически считать исходную смесь Миллера — Юри точной копией первичной атмосферы. В менее восстановительной атмосфере выход некоторых органических соединений может существенно отличаться.</li>" +
     "<li><b>Проблема хиральности.</b> В живых системах преобладают L-аминокислоты и D-сахара. При обычном абиогенном синтезе в ахиральных условиях часто образуются смеси энантиомеров. Механизм возникновения биологической гомохиральности остаётся проблемой исследований.</li>" +
     "<li><b>Концентрация и стабильность органических веществ.</b> Органические молекулы могли находиться в воде в сильно разбавленном состоянии; некоторые соединения нестабильны в водной среде и могут подвергаться гидролизу и другим реакциям разложения. Необходимо объяснить механизмы их накопления и сохранения.</li>" +
     "<li><b>Проблема полимеризации.</b> Образование биополимеров из мономеров в водной среде часто термодинамически затруднено. Например, образование пептидной связи из свободных аминокислот в водной среде требует дополнительных условий или энергетического сопряжения. Возможные пути решения этой проблемы связывают с периодическими циклами высыхания и увлажнения, поверхностями минералов и активированными соединениями.</li>" +
     "<li><b>Переход от химических систем к живым организмам.</b> Даже образование органических молекул и биополимеров ещё не означает возникновение жизни. Остаются нерешёнными вопросы: как появилась система наследственной информации, как возникла матричная репликация, как сформировались первые механизмы метаболизма, как образовались устойчивые протоклеточные структуры, как возникла система, сочетающая обмен веществ, наследственность и размножение.</li>" +
     "</ol>" +
     "<p>Вывод: эксперимент Миллера — Юри подтвердил возможность абиогенного синтеза некоторых органических соединений, но не доказал весь процесс происхождения жизни.</p>"
   },
   {
    "id": "v11",
    "q": [11],
    "title": "Вопрос 11. Эксперименты по абиогенному синтезу биополимеров",
    "html": "<p>Перечисленные эксперименты демонстрируют разные этапы химической эволюции. Одни показывают образование мономеров, другие — образование полимероподобных структур или самоорганизацию молекул. Не все они доказывают абиогенный синтез биополимеров.</p>" +
     "<div class='sub'>1. Эксперимент Миллера — Юри (1953)</div>" +
     "<p>Условия: смесь метана, аммиака, водорода и водяного пара подвергалась воздействию электрических разрядов. Результат: образование аминокислот и других органических соединений. Вывод: простые исходные вещества при определённых условиях способны образовывать органические молекулы абиогенным путём.</p>" +
     "<p>Эксперимент демонстрирует возможность образования биомономеров, но не биологических полимеров.</p>" +
     "<div class='sub'>2. Эксперименты Хуана Оро (1961)</div>" +
     "<p>Условия: химические реакции с использованием синильной кислоты (HCN) и аммиака. Результат: получение аденина — пуринового азотистого основания, входящего в состав нуклеотидов ДНК и РНК. Вывод: некоторые компоненты нуклеиновых кислот способны образовываться абиогенным путём из относительно простых исходных веществ.</p>" +
     "<p>Сам по себе аденин не является нуклеотидом или нуклеиновой кислотой.</p>" +
     "<div class='sub'>3. Эксперименты Сиднея Фокса (1950-е годы)</div>" +
     "<p>Условия: нагревание сухих смесей аминокислот. Результат: образование протеиноидов — полипептидоподобных соединений, возникающих при нагревании аминокислот. Вывод: образование полимероподобных продуктов из аминокислот возможно при определённых условиях, в том числе без водной среды.</p>" +
     "<p>Протеиноиды не следует отождествлять с полноценными белками, синтезируемыми живыми клетками.</p>" +
     "<div class='sub'>4. Эксперименты Джона Сазерленда и сотрудников (2009)</div>" +
     "<p>Условия: исследование последовательности химических реакций, позволяющих получать предшественники РНК из относительно простых исходных веществ. Результат: разработан химический путь синтеза активированных пиримидиновых рибонуклеотидов — строительных компонентов РНК. Вывод: отдельные компоненты РНК могут образовываться в результате последовательных абиогенных химических реакций.</p>" +
     "<p>Важно: эти эксперименты не означают, что в природных геотермальных источниках уже доказано спонтанное образование полноценной РНК.</p>" +
     "<div class='sub'>5. Эксперименты с коацерватами (А. И. Опарин)</div>" +
     "<p>Условия: изучение самоорганизации различных органических веществ в водных растворах. Результат: образование коацерватных капель, способных концентрировать определённые вещества и обмениваться компонентами с окружающим раствором. Вывод: органические вещества способны образовывать пространственно обособленные структуры, которые могут служить моделями отдельных этапов формирования протоклеток.</p>" +
     "<p>Коацерваты не являются полноценными клетками и сами по себе не демонстрируют наследственную систему и биологическое размножение.</p>" +
     "<div class='sub'>Общий вывод</div>" +
     "<p>Экспериментальные исследования показывают возможность отдельных этапов химической эволюции: образования органических мономеров; образования некоторых полимероподобных соединений; самоорганизации молекул в обособленные структуры. Однако последовательный переход от этих процессов к полноценным самовоспроизводящимся клеткам экспериментально не воспроизведён.</p>"
   },
   {
    "id": "v12",
    "q": [12],
    "title": "Вопрос 12. Рибозимы и центральная роль РНК",
    "html": "<div class='sub'>Определение</div>" +
     "<p>Рибозимы — это молекулы РНК, обладающие каталитической активностью и способные ускорять определённые химические реакции. Они выполняют функции, которые в большинстве современных клеточных процессов осуществляются белковыми ферментами.</p>" +
     "<div class='sub'>Пример 1. Рибосома</div>" +
     "<p>Рибосома представляет собой сложный рибонуклеопротеиновый комплекс, состоящий из рибосомальной РНК и белков. В процессе трансляции рибосома обеспечивает синтез белка на основе информации, содержащейся в матричной РНК. Каталитический центр, отвечающий за образование пептидных связей между аминокислотами, образован рибосомальной РНК. Белки рибосомы выполняют важные структурные и функциональные задачи, но непосредственно образование пептидных связей катализируется рРНК.</p>" +
     "<p>Значение: рибосома демонстрирует, что РНК может выполнять каталитическую функцию в одном из важнейших процессов жизнедеятельности — синтезе белков. Это является важным аргументом в пользу гипотезы «Мира РНК».</p>" +
     "<div class='sub'>Пример 2. Сплайсосома</div>" +
     "<p>Сплайсосома — крупный рибонуклеопротеиновый комплекс, участвующий в процессинге пре-мРНК у эукариот. Многие эукариотические гены содержат экзоны — участки, сохраняемые в зрелой РНК, и интроны — участки, удаляемые в ходе сплайсинга. В процессе сплайсинга интроны удаляются, а экзоны соединяются. РНК-компоненты сплайсосомы участвуют в формировании её каталитического центра и обеспечении химических превращений.</p>" +
     "<p>Значение: этот пример демонстрирует участие РНК не только в хранении и реализации генетической информации, но и в каталитической регуляции её обработки.</p>" +
     "<p>Важное терминологическое уточнение: сплайсинг не является редактированием генетической информации в строгом смысле. Это процессинг РНК — удаление интронов и соединение экзонов.</p>" +
     "<div class='sub'>Общий вывод</div>" +
     "<p>РНК обладает как информационными, так и каталитическими свойствами. Это позволяет рассматривать её как возможный центральный компонент ранних биологических систем до формирования современной системы, основанной на ДНК и белках. При этом наличие рибозимов поддерживает гипотезу «Мира РНК», но не доказывает все этапы её предполагаемой эволюции.</p>"
   },
   {
    "id": "v13",
    "q": [13],
    "title": "Вопрос 13. Почему АТФ — универсальная энергетическая «валюта» клетки",
    "html": "<div class='sub'>Структура АТФ</div>" +
     "<p>АТФ — аденозинтрифосфат, нуклеотид, состоящий из азотистого основания аденина, сахара рибозы и трёх фосфатных групп. АТФ является универсальным переносчиком химической свободной энергии в клетках и участвует во множестве биохимических реакций.</p>" +
     "<div class='sub'>1. Химические причины</div>" +
     "<p><b>Энергетически выгодный гидролиз.</b> При гидролизе АТФ до АДФ и неорганического фосфата происходит высвобождение свободной энергии. Уравнение: АТФ + H₂O → АДФ + Pi. Изменение стандартной свободной энергии гидролиза составляет приблизительно −30,5 кДж/моль в биохимических стандартных условиях. В клетке фактическое значение зависит от концентраций реагентов и продуктов, температуры и других условий.</p>" +
     "<p>Важно: энергия не выделяется просто в результате разрыва фосфатной связи. Энергетически выгоден весь процесс гидролиза благодаря образованию более устойчивых продуктов и другим термодинамическим факторам.</p>" +
     "<p><b>Возможность сопряжения реакций.</b> Гидролиз АТФ может быть сопряжён с энергетически невыгодными процессами. Например, за счёт переноса фосфатной группы АТФ может изменять реакционную способность молекулы и обеспечивать протекание биохимической реакции.</p>" +
     "<p><b>Универсальность химических превращений.</b> АТФ способен участвовать в различных типах реакций: фосфорилирование (перенос фосфатной группы), перенос пирофосфатной группы, аденилирование (перенос аденилильного остатка).</p>" +
     "<p><b>Возможность регенерации.</b> АТФ постоянно восстанавливается из АДФ в процессах клеточного дыхания, фотосинтеза, гликолиза и других энергетических реакциях. Это позволяет поддерживать непрерывное снабжение клетки энергией.</p>" +
     "<div class='sub'>2. Возможные исторические и пребиотические причины</div>" +
     "<p>Одна из гипотез связывает распространение АТФ с происхождением ранних биологических систем, основанных на РНК. АТФ содержит аденин и рибозу, которые также входят в состав РНК. Возможное объяснение состоит в том, что нуклеотиды первоначально участвовали в информационных и каталитических процессах, а затем стали использоваться в энергетическом обмене. Существует предположение, что нуклеотидные кофакторы могли взаимодействовать с древними каталитическими РНК.</p>" +
     "<p>Однако это историческая гипотеза, а не экспериментально установленная последовательность происхождения АТФ как универсального энергоносителя.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>АТФ стал универсальным переносчиком энергии благодаря сочетанию химической доступности, возможности сопряжения реакций, удобства переноса функциональных групп и эффективной регенерации. Возможная связь его универсальности с эволюцией РНК-содержащих систем представляет собой интересную, но пока не доказанную гипотезу.</p>"
   }
  ]
 },

    "html": "<div class='sub'>Уравнение окисления аммония</div>" +
     "<p>Суммарное уравнение окисления аммония до нитрита:</p>" +
     "<div class='formula'>2NH₄⁺ + 3O₂ → 2NO₂⁻ + 4H⁺ + 2H₂O</div>" +
     "<div class='sub'>Энергетический смысл</div>" +
     "<p>Нитрифицирующие бактерии окисляют восстановленное неорганическое соединение — аммоний — до нитрита. В процессе реакции электроны передаются кислороду, который выступает конечным акцептором электронов. В результате окислительно-восстановительной реакции выделяется свободная энергия. Эта энергия используется для создания трансмембранного электрохимического градиента протонов. При обратном движении протонов через АТФ-синтазу энергия градиента используется для синтеза АТФ из АДФ и неорганического фосфата.</p>" +

    "title": "Вопрос 15. Бактериородопсин как простейшая фотохимическая машина",
    "html": "<div class='sub'>Общая характеристика</div>" +
     "<p>Бактериородопсин — светочувствительный трансмембранный белок, обнаруживаемый у некоторых галофильных архей. В его структуре присутствует простетическая группа — ретиналь, производное витамина А. Бактериородопсин действует как светозависимый протонный насос. Он не осуществляет классический фотосинтез: его основная функция состоит в использовании энергии света для переноса протонов через мембрану.</p>" +
     "<div class='sub'>Механизм работы</div>" +
     "<ol>" +
     "<li><b>Поглощение фотона.</b> Ретиналь в all-trans-форме поглощает фотон видимого света.</li>" +
     "<li><b>Фотоизомеризация.</b> Под действием света ретиналь переходит из all-trans-формы в 13-cis-форму. Это изменение пространственной конфигурации молекулы запускает последовательность конформационных изменений белка.</li>" +
     "<li><b>Изменение конформации белка.</b> Перестройка бактериородопсина приводит к последовательным изменениям положения и кислотно-основных свойств функциональных групп.</li>" +
     "<li><b>Перенос протона.</b> Протон переносится через белок от внутренней стороны мембраны к внешней. В процессе переноса участвуют ретиналь и аминокислотные остатки белка, в том числе остатки аспарагиновой кислоты.</li>" +
     "<li><b>Возвращение в исходное состояние.</b> Ретиналь восстанавливает исходную all-trans-конфигурацию, протонируется со стороны цитоплазмы, и белок возвращается к исходному состоянию. Цикл может повторяться после поглощения следующего фотона.</li>" +
     "</ol>" +
     "<div class='sub'>Судьба энергии фотона</div>" +
     "<p>Энергия поглощённого фотона используется для фотоизомеризации ретиналя и последующих конформационных изменений белка. В результате энергия света преобразуется в энергию электрохимического протонного градиента. Далее этот градиент может использоваться АТФ-синтазой для синтеза АТФ.</p>" +
     "<div class='formula'>Свет → изомеризация ретиналя → конформационные изменения белка → перенос протонов → образование электрохимического градиента → синтез АТФ</div>" +
     "<p>Таким образом, бактериородопсин преобразует световую энергию в форму, доступную для использования клеткой.</p>"
   },

    "title": "Вопрос 16. Кислород-выделяющий комплекс",
    "html": "<div class='sub'>Определение</div>" +
     "<p>Кислород-выделяющий комплекс (КВК) — металлоорганический каталитический центр фотосистемы II, обеспечивающий окисление воды в процессе оксигенного фотосинтеза. В основе активного центра находится кластер Mn₄CaO₅, содержащий четыре атома марганца и один атом кальция.</p>" +
     "<div class='sub'>Расположение</div>" +
     "<p>КВК находится в фотосистеме II на стороне люмена тилакоида. Он функционально связан с реакционным центром фотосистемы II.</p>" +
     "<div class='sub'>Химическая функция</div>" +
     "<p>КВК катализирует реакцию окисления воды:</p>" +
     "<div class='formula'>2H₂O → O₂ + 4H⁺ + 4e⁻</div>" +
     "<p>В результате реакции из двух молекул воды образуется одна молекула кислорода; четыре электрона поступают в электрон-транспортную цепь; четыре протона выделяются в люмен тилакоида. Окисление воды происходит последовательно, с накоплением четырёх окислительных эквивалентов в активном центре. Электроны, полученные при окислении воды, через последовательность переносчиков компенсируют потерю электронов реакционным центром фотосистемы II (P680).</p>" +
     "<div class='sub'>Почему возникновение КВК стало важнейшей инновацией</div>" +
     "<p><b>1. Использование воды в качестве донора электронов.</b> До появления оксигенного фотосинтеза известные фотосинтетические системы использовали другие доноры электронов, например сероводород. Возникновение механизма окисления воды обеспечило использование широко распространённого источника электронов.</p>" +
     "<p><b>2. Накопление кислорода в атмосфере.</b> Оксигенный фотосинтез привёл к постепенному увеличению концентрации свободного кислорода в атмосфере Земли. Важным этапом стало Великое кислородное событие, произошедшее приблизительно 2,4 млрд лет назад. Появление кислорода радикально изменило условия существования живых организмов и создало проблемы для многих анаэробных форм жизни.</p>" +
     "<p><b>3. Возникновение условий для аэробного дыхания.</b> Кислород стал важнейшим конечным акцептором электронов в аэробном клеточном дыхании. Это обеспечило возможность получения значительных количеств АТФ за счёт окисления органических веществ. Не следует утверждать, что аэробное дыхание всегда даёт строго в 18 раз больше АТФ, чем брожение: выход энергии зависит от субстрата, организма и условий метаболизма.</p>" +
     "<p><b>4. Образование озонового слоя.</b> В результате фотохимических реакций с участием кислорода в атмосфере образуется озон. Озоновый слой поглощает значительную часть опасного ультрафиолетового излучения, способствуя защите живых организмов на поверхности Земли.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Возникновение кислород-выделяющего комплекса обеспечило переход к оксигенному фотосинтезу, изменило химический состав атмосферы и создало условия для широкого распространения аэробного метаболизма.</p>"
   },

    "id": "v17",
    "q": [17],
    "title": "Вопрос 17. Эволюционная логика усложнения фотосинтеза",
    "html": "<p>Сначала необходимо сделать важную оговорку: бактериородопсин не является предшественником фотосинтетических систем в смысле доказанного прямого эволюционного происхождения. Это отдельный механизм преобразования энергии света, который удобно сравнивать с фотосинтезом при рассмотрении эволюции биоэнергетических процессов.</p>" +
     "<div class='sub'>1. Светозависимый протонный насос — бактериородопсин</div>" +
     "<p>Механизм: бактериородопсин поглощает свет и использует полученную энергию для переноса протонов через мембрану.</p>" +
     "<p>Решаемая проблема: энергетическая. Световая энергия преобразуется в электрохимический градиент протонов, который используется для синтеза АТФ.</p>" +
     "<p>Ограничение: сам бактериородопсин не обеспечивает образование восстановленных соединений за счёт фотосинтетического переноса электронов. Поэтому он не позволяет самостоятельно осуществлять фиксацию CO₂ по механизму оксигенного или аноксигенного фотосинтеза.</p>" +
     "<div class='sub'>2. Аноксигенный фотосинтез</div>" +
     "<p>Аноксигенный фотосинтез характерен для ряда фототрофных бактерий. Используется одна фотосинтетическая реакционная система. В качестве доноров электронов могут выступать H₂S, H₂, Fe²⁺, некоторые органические соединения. В процессе не выделяется молекулярный кислород, поскольку вода не используется в качестве донора электронов.</p>" +
     "<p>Решаемые проблемы:</p>" +
     "<ul><li>энергетическая — преобразование световой энергии в электрохимический градиент, синтез АТФ;</li><li>восстановительная — получение восстановительных эквивалентов для синтеза органических веществ, возможность фиксации CO₂ у фототрофов, осуществляющих фотоавтотрофное питание.</li></ul>" +
     "<p>Ограничение: использование внешних доноров электронов ограничивает набор доступных источников восстановительной силы. При этом разные группы аноксигенных фототрофов обладают различными реакционными центрами и метаболическими возможностями.</p>" +
     "<p>Важно: названия фотосистем I и II относятся к конкретным системам оксигенного фотосинтеза цианобактерий и растений. Не следует автоматически называть реакционные центры аноксигенных бактерий фотосистемами I и II.</p>" +
     "<div class='sub'>3. Оксигенный фотосинтез</div>" +
     "<p>Оксигенный фотосинтез характерен для цианобактерий, водорослей и высших растений. Используются две фотосистемы: фотосистема II и фотосистема I. Они работают последовательно, формируя Z-схему переноса электронов. Ключевым компонентом фотосистемы II является кислород-выделяющий комплекс.</p>" +
     "<p>Решаемые проблемы:</p>" +
     "<ul><li>восстановительная — появляется возможность использовать воду как донор электронов, образуются восстановительные эквиваленты, необходимые для синтеза органических соединений;</li><li>энергетическая — световая энергия двух фотосистем используется для обеспечения переноса электронов, создаётся протонный градиент, необходимый для синтеза АТФ.</li></ul>" +
     "<div class='sub'>Последствия появления оксигенного фотосинтеза</div>" +
     "<ul><li>выделение молекулярного кислорода;</li><li>изменение состава атмосферы Земли;</li><li>появление условий для распространения аэробного дыхания;</li><li>изменение эволюционных условий существования живых организмов.</li></ul>" +
     "<div class='sub'>Общая эволюционная логика</div>" +
     "<p>В рамках учебной схемы можно выделить три принципиально разных механизма:</p>" +
     "<ol><li>преобразование света в протонный градиент с помощью бактериородопсина;</li><li>использование света для получения энергии и восстановительной силы при аноксигенном фотосинтезе;</li><li>появление оксигенного фотосинтеза, использующего воду как донор электронов и сопровождающегося выделением кислорода.</li></ol>" +
     "<p>Эту последовательность следует понимать как сравнительную схему развития биоэнергетических механизмов, а не как доказанную прямую линию происхождения всех современных фотосинтетических организмов.</p>"
   },
   {
    "id": "v18",
    "q": [18],
    "title": "Вопрос 18. Современный метаболизм и рибозимный катализ",
    "html": "<div class='sub'>1. Гипотеза «Мира РНК»</div>" +
     "<p>Согласно гипотезе, на ранних этапах возникновения жизни РНК могла выполнять две важнейшие функции: хранение генетической информации и каталитическое ускорение химических реакций. Эта гипотеза позволяет предположить существование ранних систем, в которых ещё не было современного разделения функций между ДНК, РНК и белками.</p>" +
     "<div class='sub'>2. Рибосома как пример древнего РНК-зависимого катализа</div>" +
     "<p>Рибосома представляет собой рибонуклеопротеиновый комплекс. Её каталитический центр образован рРНК, которая катализирует образование пептидных связей при синтезе белков. Это показывает, что в современной клетке сохранились важнейшие каталитические функции РНК. Данный факт согласуется с гипотезой о древнем происхождении РНК-зависимого катализа.</p>" +
     "<div class='sub'>3. Нуклеотидные коферменты</div>" +
     "<p>Многие современные коферменты содержат нуклеотидные компоненты:</p>" +
     "<ul>" +
     "<li>АТФ — переносчик химической свободной энергии;</li>" +
     "<li>НАД⁺ и НАДФ⁺ — переносчики электронов и восстановительных эквивалентов;</li>" +
     "<li>ФАД — компонент окислительно-восстановительных ферментов;</li>" +
     "<li>коэнзим А — переносчик ацильных групп;</li>" +
     "<li>S-аденозилметионин (SAM) — донор метильных групп;</li>" +
     "<li>УДФ-глюкоза — активированная форма глюкозы, участвующая в биосинтезе.</li>" +
     "</ul>" +
     "<p>Нуклеотидные компоненты этих молекул могут рассматриваться как возможные эволюционные следы древних РНК-зависимых систем. Однако сам факт присутствия нуклеотидных частей в коферментах не доказывает, что все они первоначально возникли как кофакторы рибозимов.</p>" +
     "<div class='sub'>4. Эволюционный переход к белковому катализу</div>" +
     "<p>Предполагается, что в ходе эволюции белковые ферменты постепенно расширили каталитические возможности ранних биологических систем. Белки обеспечили разнообразие структур и химических свойств, благодаря чему стало возможным формирование сложных метаболических путей. РНК при этом сохранила важные информационные, каталитические и регуляторные функции.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Гипотеза «Мира РНК» предполагает, что современный метаболизм мог сформироваться на основе более древних систем, в которых важную роль играл рибозимный катализ. Сохранение каталитической функции РНК в рибосоме и присутствие нуклеотидных компонентов в современных коферментах согласуются с этой гипотезой.</p>" +
     "<p>Но называть эти факты прямым доказательством происхождения всего современного метаболизма из мира РНК нельзя: это косвенные аргументы в пользу эволюционной модели.</p>"
   },
   {
    "id": "v19",
    "q": [19],
    "title": "Вопрос 19. Аргументы в пользу абиогенеза",
    "html": "<div class='sub'>1. Теоретические предпосылки</div>" +
     "<p><b>Принцип непрерывности химической эволюции.</b> Абиогенез рассматривает возникновение жизни как естественный процесс постепенного усложнения химических систем. При этом предполагается, что переход от неживой материи к живым системам происходил через последовательность физико-химических процессов.</p>" +
     "<p><b>Универсальность законов химии и физики.</b> Реакции образования органических молекул, полимеризации и самоорганизации подчиняются физическим и химическим закономерностям. Поэтому отдельные этапы химической эволюции можно изучать экспериментально.</p>" +
     "<p><b>Гипотеза «Мира РНК».</b> РНК способна хранить наследственную информацию и осуществлять каталитические функции. Это делает возможной гипотезу о существовании ранних биологических систем, в которых РНК выполняла одновременно информационную и каталитическую роль.</p>" +
     "<div class='sub'>2. Экспериментальные аргументы</div>" +
     "<p><b>Абиогенный синтез органических молекул.</b> Эксперимент Миллера — Юри показал возможность образования аминокислот и других органических соединений из простых исходных веществ. Эксперименты Оро продемонстрировали возможность образования аденина из простых пребиотических соединений.</p>" +
     "<p><b>Образование полимероподобных соединений.</b> Эксперименты Фокса показали возможность получения протеиноидов из аминокислот при определённых условиях.</p>" +
     "<p><b>Получение компонентов РНК.</b> Работы Сазерленда продемонстрировали возможность построения химических путей образования некоторых рибонуклеотидов из более простых исходных веществ.</p>" +
     "<p><b>Самоорганизация молекул.</b> Коацерватные капли и липосомы показывают, что органические вещества способны формировать обособленные структуры. Это позволяет исследовать возможные механизмы образования протоклеток.</p>" +
     "<div class='sub'>3. Дополнительные аргументы</div>" +
     "<p>В космических объектах обнаруживаются органические соединения, что демонстрирует возможность их образования вне живых организмов. Однако это свидетельствует о распространённости абиогенной органической химии, а не о доказанном существовании внеземной жизни.</p>" +
     "<div class='sub'>4. Ограничения гипотезы</div>" +
     "<p>Несмотря на экспериментальную поддержку отдельных этапов, остаются нерешёнными: происхождение первой самовоспроизводящейся системы; происхождение генетического кода; возникновение матричного синтеза; появление устойчивого обмена веществ; формирование полноценной клетки.</p>" +
     "<div class='sub'>Сравнение с альтернативными взглядами</div>" +
     "<p>Панспермия допускает перенос жизни или её предшественников из космоса, но не объясняет первоначальное происхождение жизни. Креационизм предлагает сверхъестественное объяснение, которое в своей традиционной форме не содержит проверяемого естественнонаучного механизма.</p>" +
     "<div class='sub'>Вывод</div>" +
     "<p>Абиогенез является основным естественнонаучным направлением исследования происхождения жизни, поскольку предлагает проверяемые химические механизмы, отдельные этапы которых получили экспериментальное подтверждение. Однако пока не существует полного экспериментального воспроизведения перехода от неживой материи к первой клетке. Поэтому гипотезу абиогенеза нельзя представлять как окончательно доказанную теорию возникновения жизни.</p>"
   }
  ]
 },
 {

   {
    "id": "v20",
    "q": [20],
    "title": "Вопрос 20. Общие сведения о Земле, её строение и дрейф континентов",
    "html": "<div class='sub'>1. Общие сведения</div>" +
     "<p>Земля — третья планета Солнечной системы от Солнца. Единственная известная на данный момент планета, на которой существует жизнь. Естественный спутник — Луна.</p>" +
     "<ul>" +
     "<li>средняя скорость движения по орбите — 29,78 км/с;</li>" +
     "<li>период обращения вокруг Солнца — 365,24 суток;</li>" +
     "<li>средний радиус — 6371 км;</li>" +
     "<li>площадь поверхности — 5,10 × 10⁸ км²;</li>" +
     "<li>средняя плотность — 5,52 г/см³;</li>" +
     "<li>возраст — около 4,54 млрд лет;</li>" +
     "<li>среднее расстояние от Солнца — около 150 млн км;</li>" +
     "<li>масса — 5,97 × 10²⁴ кг.</li>" +
     "</ul>" +
     "<p><b>Атмосфера.</b> Основные компоненты сухого воздуха: азот — около 78%; кислород — около 21%; аргон — около 0,93%; углекислый газ — около 0,04% (содержание изменяется со временем). Также в атмосфере присутствуют другие газы и водяной пар.</p>" +
     "<p><b>Гидросфера.</b> Включает океаны, моря, реки, озёра, подземные воды, ледники и другие формы существования воды. Около 71% поверхности Земли покрыто водой.</p>" +
     "<div class='sub'>2. Внутреннее строение Земли</div>" +
     "<p>Земля имеет слоистое внутреннее строение.</p>" +
     "<p><b>Внутреннее ядро.</b> Состоит преимущественно из железа и никеля; находится в твёрдом состоянии; радиус — приблизительно 1220 км. Несмотря на высокую температуру, внутреннее ядро остаётся твёрдым из-за огромного давления.</p>" +
     "<p><b>Внешнее ядро.</b> Расположено вокруг внутреннего ядра; состоит преимущественно из жидкого железосодержащего вещества; толщина — приблизительно 2250 км. Движение электропроводящего вещества внешнего ядра участвует в формировании магнитного поля Земли посредством механизма геодинамо.</p>" +
     "<p><b>Мантия.</b> Состоит преимущественно из силикатного вещества, содержащего магний и железо; толщина — около 2900 км. На длительных геологических временных масштабах способна к медленному течению. В мантии происходят процессы переноса тепла и конвективного движения вещества.</p>" +
     "<p><b>Земная кора.</b> Верхняя твёрдая оболочка Земли. Различают континентальную кору — обычно около 30–70 км, с преобладанием пород гранитного и более широкого силикатного состава, — и океаническую кору — обычно около 5–10 км, представленную преимущественно базальтовыми и другими основными породами.</p>" +
     "<div class='sub'>3. Дрейф континентов и тектоника литосферных плит</div>" +
     "<p>Дрейф континентов — изменение пространственного положения континентов на поверхности Земли в течение геологического времени. Современное объяснение этого процесса основано на теории тектоники литосферных плит.</p>" +
     "<p>Литосфера состоит из земной коры и верхней части мантии, находящейся в твёрдом механическом состоянии. Она разделена на относительно жёсткие плиты, которые перемещаются относительно друг друга. Плиты движутся по отношению к более пластичному материалу верхней мантии. Скорости движения обычно составляют от нескольких миллиметров до нескольких сантиметров в год.</p>" +
     "<p><b>Причины движения плит.</b> Движение плит обусловлено несколькими связанными процессами: конвективными движениями вещества мантии; тягой погружающейся в мантию океанической плиты (slab pull); действием сил, связанных с возвышенными срединно-океаническими хребтами (ridge push). Поэтому неверно объяснять движение плит исключительно тем, что горячее вещество мантии поднимается и механически толкает литосферу.</p>" +
     "<div class='sub'>Типы границ литосферных плит</div>" +
     "<ul>" +
     "<li><b>Дивергентные границы.</b> Плиты расходятся. В результате происходит подъём мантийного вещества, плавление части пород и образование новой океанической литосферы. Пример: срединно-океанические хребты.</li>" +
     "<li><b>Конвергентные границы.</b> Плиты сближаются. Возможные процессы: субдукция — погружение одной плиты под другую; столкновение континентальных плит (коллизия). При субдукции образуются глубоководные желоба, вулканические дуги и зоны землетрясений. При столкновении континентальных плит могут возникать крупные горные системы, например Гималаи.</li>" +
     "<li><b>Трансформные границы.</b> Плиты смещаются относительно друг друга преимущественно в горизонтальном направлении. На таких границах часто происходят землетрясения. Пример: разлом Сан-Андреас.</li>" +
     "</ul>" +
     "<div class='sub'>Доказательства тектоники литосферных плит</div>" +
     "<ul>" +
     "<li>геометрическое соответствие очертаний некоторых континентальных окраин;</li>" +
     "<li>совпадение геологических структур и ископаемых остатков на разделённых океанами территориях;</li>" +
     "<li>палеомагнитные полосы на океаническом дне;</li>" +
     "<li>обнаружение закономерного распределения возраста океанической коры;</li>" +
     "<li>распределение землетрясений и вулканической активности по границам плит;</li>" +
     "<li>современные GPS-измерения, непосредственно фиксирующие перемещение плит.</li>" +
     "</ul>" +
     "<p>Вывод: современная теория тектоники плит объясняет перемещение континентов, образование океанов, горных систем, землетрясения и вулканическую активность.</p>"
   }
  ]
 },
 {
